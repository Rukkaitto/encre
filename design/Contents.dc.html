<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">CONTENTS</div>
  <div style="font-size: var(--t-value); font-weight: 700;">MIDDLEMARCH</div>
</div>
  <!-- NO `border-top` ON EITHER HEADER, AND NO `border-bottom` ON THE ROW ABOVE ONE.
       Those two absences are ONE decision and they are paired deliberately, said out
       loud here because nothing on this board said so and the implementation copied
       Settings' shape instead: `renderContents` drew the row's 1px rule AND a 2px
       `border-top`, a 3px full-width line where this board draws none, ~11% of the
       screen's whole mismatch and the largest contiguous band on it (#81).

       WHY THIS BOARD DIFFERS FROM ITS SETTINGS SIBLING, which does give every
       non-first header a `border-top: 2px`: a section there is a change of SUBJECT --
       READING, SLEEP SCREEN, DEVICE are three unrelated groups of controls, and a hard
       divider is what says so. A part of a book is not. This is one continuous reading
       sequence and its parts are a soft hierarchy over it, so the grouping is carried
       by the label's own 18/6 padding and its tracked caps, which is separation enough
       on this glass. A rule here would read as the list ending and restarting.

       AND THIS LIST SCROLLS, where Settings today does not. Settings' rule is
       POSITIONAL -- the first header in the window has none, because the band's own 2px
       border is already the separation -- so a header that ruled at all would be a
       first-versus-later question this screen has to get right at every scroll offset,
       for a line it does not want anywhere. No rule, no question.

       The section-final row's missing `border-bottom` is the other half: with the
       header carrying no line, a row rule there would be the whole defect at 1px
       instead of 3. `VI` and `VIII` both drop it -- `VIII` because it is also the last
       row drawn, which is every list's rule here. -->
  <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">BOOK I &middot; MISS BROOKE</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; background: #000000; color: #ffffff;">
  <div style="font-size: var(--t-value); font-weight: 700;">I &middot; Miss Brooke</div>
      <!-- NO NUMBER IN THIS SLOT AT ALL, and it has held two wrong things now. It was
           `P. 21` -- a page number for a place in the BOOK, which needs every chapter
           paginated (~49 s of decode). That became `CH. 01`, the spine position, which
           is free and true and turned out to be WORSE on a real book: chapter names
           carry their own numbering, so a row read `Chapitre 1.        CH. 09` -- two
           numbering systems side by side, neither explaining the other.

           The NAME is the content of a table of contents. `NOW` still marks the row
           being read, which is the one thing in this slot a reader needs, and it
           leaves the full width for names that run long. -->
  <div style="font-size: var(--t-value); font-weight: 700;">NOW</div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">II &middot; Sir James courts</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">III &middot; The engagement</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">IV &middot; Celia&rsquo;s doubts</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">V &middot; Mr. Casaubon writes</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">VI &middot; Mrs. Cadwallader</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">BOOK II &middot; OLD AND YOUNG</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">VII &middot; Rome</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">VIII &middot; Will Ladislaw</div>
  <div style="font-size: var(--t-value); font-weight: 700;"></div>
</div>
  <div style="margin-top: auto;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">GO</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
</div>
</div>
