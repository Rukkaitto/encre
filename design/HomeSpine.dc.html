<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>

<!--
  HOME AS A BOOK SPINE. A PROPOSAL FOR Main.dc.html, NOT A SHIPPING BOARD.

  WHAT IT IS FOR. Main.dc.html is crowded, and the ARTICLES row did not cause
  that -- it exposed it. Measured off the rendered board at 480x800: the menu and
  the hint bar own 307px (38% of the panel), the `6%` numeral and the progress
  bar together own 123px (15%) SAYING ONE THING TWICE, and the title -- the one
  fact this screen exists to state -- gets 88px, two lines. The title has less
  room than the duplicated percentage. With `A Portrait of the Artist as a Young
  Man` the shipped board overflows: 529 ink pixels past the bottom edge, the hint
  bar pushed off the glass. The firmware clamps to two lines and elides instead,
  which is the same fact wearing a different symptom.

  WHAT THE SPINE DOES ABOUT IT. Moving the title to a vertical spine takes it out
  of the competition for height altogether. The spine runs 692px on the X4 and
  684 on the X3 per line and wraps to two, so 1,384px of run against the 608px
  that two lines of Main.dc.html's 304px title column give -- 2.3x on the X4 and
  1.9x on the X3 (1,368 against 704). Title length stops being a budget question. The `6%` numeral stays and the progress BAR goes: they were the same
  fact, and the numeral is the one this screen already sizes as the hero.

  ITS ANCESTOR IS DirectionSpine.dc.html (page-1, `F - Spine`), which proposed a
  vertical title with a cover block beside it. There is NO COVER here, for
  Main.dc.html's own reason: a dithered placeholder claims a picture this screen
  does not have, and an absent claim beats a false one. What the spine takes is
  the width the cover would have.

  THE 112px IS NOT A TASTE, IT IS AN ALIGNMENT. Under Rotation::Ccw the
  framebuffer maps physX = logY (framebuffer.cpp byteIndex), so a full-height
  band at logical x in [0, 112) is 112 CONSECUTIVE PHYSICAL ROWS. Draw the title
  horizontally into a scratch Framebuffer(panelH, 112, Rotation::None) and its
  stride comes out identical to the main buffer's -- 99 bytes on the X3, 100 on
  the X4 -- so the transfer is a plain memcpy of 11,088 / 11,200 bytes and the
  glyph blit is never touched. 112 is a multiple of 8, which is what makes the
  band start on a byte boundary; a thickness that is not would force a per-pixel
  transpose, which is a new byte-wise primitive carrying the rotation hazard that
  has bitten this project five times. IF THIS NUMBER CHANGES, KEEP IT DIVISIBLE
  BY 8.

  AND VERTICAL TEXT IS THE CHEAP CASE HERE, WHICH IS THE OPPOSITE OF THE OBVIOUS
  GUESS. Checked across all four combinations of rotation and orientation: on an
  unrotated buffer a glyph's bitmap row lands on one contiguous physical row and
  a vertical one scatters across eight bytes, and UNDER Ccw THE TWO SWAP. So
  horizontal text is the awkward case on this device -- which is why blitGlyphT
  has a Ccw branch walking glyph COLUMNS -- and vertical text is the one the
  hardware likes. The desktop gets the slow path and the panel gets the fast one,
  which inverts this project's usual ratio trap: a desktop bench here UNDERSTATES
  the device.

  THE TITLE WRAPS TO TWO VERTICAL LINES rather than eliding. That is #74's rule
  -- an ellipsis on a list row hides which of seven rows this is, and here it
  hides the thing the screen exists to say -- and a thick book sets its spine in
  two lines anyway. `A Portrait of the Artist as a Young Man` needs both at both
  geometries; the first draft was one nowrap line and was CLIPPED AT BOTH ENDS
  with no ellipsis to say so.

  THE GAP BETWEEN CONTINUE AND THE MENU IS DELIBERATE. DO NOT CLOSE IT. It
  measures 196px on the X4 and 188px on the X3 and it does NOT shrink when the
  title grows, because the title is no longer in that column -- so it reads like
  slack that is not doing its job, and it is not. BookDetails.dc.html ships a
  217px band of exactly this shape, larger than this one, and reads as calm. On a
  fixed-size panel there is no fold and nothing below, so white space costs
  nothing. Four treatments were drawn and measured: centring the block only
  redistributes it (263px of blank against 289px), floating the menu up MAKES IT
  WORSE by moving a 194px hole to the foot and detaching the hint bar from the
  rows it labels, and filling it with a NEXT UP block genuinely closes it but
  needs data the device does not have -- there is no most-recent (nothing tracks
  it) and no newest (FileSystem carries no timestamps), which is the wall
  HomeUnopened.dc.html already hit.

  WHAT THIS BOARD DOES NOT ANSWER, AND IT IS THE REASON IT IS NOT Main.dc.html
  YET: THE EMPTY STATES. HomeEmpty.dc.html (no books) and HomeUnopened.dc.html
  (nothing open) have no title, so they have no spine -- and a 112px black band
  with nothing on it is not a design. Three shapes are possible and choosing
  between them is an owner's decision rather than this file's: the spine carries
  the DEVICE's name, the spine is absent and the screen falls back to today's
  centred block, or the spine stays as a plain black rule. HomeCharging.dc.html
  and HomeMissing.dc.html are not affected -- the first differs from Home only in
  which battery mark the band draws, and the second has a title.

  THE MENU ROWS ARE 74px HERE AND 80 ON Main.dc.html. That is the one number this
  board changes about the menu, and it is what keeps three rows plus the hint bar
  inside the shorter right column once the top band is gone. The ROW's own model
  is otherwise Main's exactly -- a row states a quantity or discloses a screen,
  never both, so LIBRARY carries a count, ARTICLES carries `3 UNREAD` when there
  is something to report and the chevron otherwise, and SETTINGS carries the
  chevron.

  THERE IS NO `NOW READING` BAND. The spine names the book, so a label saying a
  book is being read would title something that is already unmistakable, and the
  2px rule under it would divide the spine from its own column. What survives is
  the battery, which is true on every screen.

  NOT IN tools/compare-design.py, DELIBERATELY. It has no screen id of its own --
  it is an alternative rendering of `home` -- and a second row naming `home`
  would be #77 exactly, one screen id counted twice on every run. It inherits
  Main.dc.html's row if and when it is adopted.
-->

<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; flex-grow: 1; min-height: 0;">

    <!-- THE SPINE. `writing-mode: vertical-rl` plus a 180deg rotation is what
         sets the run bottom-to-top, which is how a spine reads on a shelf with
         the book upright. `overflow: hidden` on BOTH this box and the run is
         load-bearing: a title longer than two vertical lines is clipped rather
         than allowed to escape into the hint bar, which is what the first draft
         did at both geometries. -->
    <div style="width: 112px; flex-shrink: 0; background: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 22px 0; overflow: hidden;">
      <div style="writing-mode: vertical-rl; transform: rotate(180deg); font-size: var(--t-title); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.12; max-height: 100%; overflow: hidden;">Middlemarch</div>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 7px; padding: 18px 24px 0 20px;">
        <div style="font-size: var(--t-value); font-weight: 700;">87%</div>
        <svg width="38" height="21" viewBox="0 0 22 12" fill="none"><rect x="0.5" y="0.5" width="18" height="11" stroke="#000000"></rect><rect x="2" y="2" width="14" height="8" fill="#000000"></rect><rect x="19.5" y="3.5" width="2" height="5" fill="#000000"></rect></svg>
      </div>

      <!-- THE AUTHOR IS SHOUTED AT `--t-meta` because it is a label here rather
           than the second line of a title block: the spine has taken the naming
           job, so this run is metadata about it. THE CHAPTER ELIDES for Main's
           reason -- the words come off the card, a real chapter name runs long
           ("PREMIERE PARTIE : A LIRE AVANT L'ACHAT"), and this run has one line.
           It may NOT wrap: the column has no growable run and adding one would
           put a second thing competing for the height the spine exists to free. -->
      <div style="padding: 26px 24px 0 20px;">
        <div style="font-size: var(--t-meta); letter-spacing: 0.2em;">GEORGE ELIOT</div>
        <div style="font-size: var(--t-display); font-weight: 700; line-height: 1; margin-top: 18px;">6%</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">I &middot; Miss Brooke</div>
      </div>

      <!-- 68px, not Main's 72: the slab sits in the narrower right column and
           the four px come back to the menu below it. Its `padding: 0 18px` is
           the column's own inset rather than the screen margin, which is what
           keeps the arrow on the same right edge as the menu's values. -->
      <div style="padding: 26px 24px 0 20px;">
        <div style="background: #000000; color: #ffffff; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">
          <div style="font-size: var(--t-label); letter-spacing: 0.2em; font-weight: 500;">CONTINUE</div>
          <svg width="32" height="25" viewBox="0 0 18 14" fill="none"><path d="M1 7h15M11 1l6 6-6 6" stroke="#ffffff" stroke-width="2"></path></svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; margin-top: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; height: 74px; padding: 0 24px 0 20px; border-top: 1px solid #000000;">
          <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">LIBRARY</div>
          <div style="font-size: var(--t-value); font-weight: 700;">12</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 74px; padding: 0 24px 0 20px; border-top: 1px solid #000000;">
          <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">ARTICLES</div>
          <div style="font-size: var(--t-value); font-weight: 700;">3 UNREAD</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 74px; padding: 0 24px 0 20px; border-top: 1px solid #000000;">
          <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">SETTINGS</div>
          <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
        </div>
      </div>

    </div>
  </div>

  <!-- The hint bar spans the FULL width, spine included: it describes the four
       buttons, which belong to the device rather than to a column. Four slots in
       hardware order, always one line tall. -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="1.4"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="1.4"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">READ</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">SELECT</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
