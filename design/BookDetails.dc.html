<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    .dither-dots { background-color: #ffffff; background-image: radial-gradient(circle, #000000 1.1px, transparent 1.3px); background-size: 4px 4px; }
    .dither-dots-inv { background-color: #000000; background-image: radial-gradient(circle, #ffffff 1.1px, transparent 1.3px); background-size: 4px 4px; }
    .dim-veil { background-image: radial-gradient(circle, #ffffff 1.3px, transparent 1.5px); background-size: 3px 3px; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">ABOUT THIS BOOK</div>
  <div style="font-size: var(--t-value); font-weight: 700;">EPUB</div>
</div>
  <!-- The one screen where a long name WRAPS instead of truncating: this is the
       page about the book, so its name is the content and an ellipsis here hides
       the thing the reader came to read. The column therefore takes the width the
       cover leaves (`flex: 1; min-width: 0`) and the title breaks inside a word
       when it has to -- a real filename is one unbreakable word.
       `min-height: 0; overflow: hidden` on the block is the other half of that
       decision: Book details is a fixed one-screen summary (spec 4.1b), so when a
       name is tall enough to push the field rows off the bottom it is the NAME
       that yields, not the rows and not the hint bar. -->
  <div style="display: flex; gap: 20px; padding: 24px 24px 20px 24px; align-items: flex-start; min-height: 0; overflow: hidden;">
    <div class="dither-dots" style="width: 120px; height: 180px; border: 2px solid #000000; box-sizing: border-box; flex-shrink: 0;"></div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px; flex: 1; min-width: 0;">
      <div style="font-size: var(--t-title); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere;">Dubliners</div>
      <div style="font-size: var(--t-body);">James Joyce</div>
      <!-- NO SUBTITLE LINE. This drew `Fifteen stories - 1914`, and there is no such
           field in the data: checked across four real books, NOT ONE carries a
           `title-type=subtitle` refinement or any subtitle marker. `dc:date` is in all
           four, but a publication year is not a subtitle -- deriving one from the other
           would be a different fact wearing its clothes.

           The board's copy was authored, and a row that can never be filled is worse
           than one that is not there: it reads as a device that failed to load
           something. Removed rather than left blank. -->
    </div>
  </div>
  <div style="display: flex; flex-direction: column; border-top: 2px solid #000000;">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">Progress</div>
      <!-- THE PERCENTAGE ALONE. This said `31% - PAGE 78 OF 252`, and a page number for
           a place in the BOOK needs every chapter paginated: 6.94 MB of inflated XHTML
           for a real novel, ~49 s of decode at this device's measured 7.2 ms/KB, paid
           before this screen could draw.

           The percentage is free -- it is stored in the book's own sidecar when the
           reader leaves it, computed from the book's BYTE layout rather than its pages
           (reading_store.h). Third slot on the third board to lose a page count for the
           same reason; Home's CONTINUE block and Contents' rows were the others. -->
  <div style="font-size: var(--t-value); font-weight: 700;">31%</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">Current chapter</div>
  <!-- `Current chapter`, and this row said `Current story`. Every other slot on the
       device that names this thing calls it a chapter -- the reading page's header, the
       contents list, Home's counter -- and one screen calling it a story was the odd one
       out. The value is the chapter's own name from the book's table of contents,
       carried in the reading position's sidecar. -->
  <div style="font-size: var(--t-value); font-weight: 700;">ARABY</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">Bookmarks</div>
  <div style="font-size: var(--t-value); font-weight: 700;">0</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">File size</div>
  <div style="font-size: var(--t-value); font-weight: 700;">0.4 MB</div>
</div>
    <!-- NO `Added` ROW. It wanted a file timestamp and `DirEntry` is
         `{name, isDir, size}` -- no date anywhere in the FileSystem interface, so
         filling it is a change across three implementations and the contract's 27
         clauses rather than a metadata question. SdFat does expose file dates, so it is
         reachable; it is just not this screen's work.

         Same call as the subtitle above: a row that cannot be filled reads as a failure
         to load, so it goes rather than sitting blank. Five rows now, not six. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">Location</div>
  <div style="font-size: var(--t-value); font-weight: 700;">/BOOKS/</div>
</div>
  </div>
  <div style="margin-top: auto;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="width: 36px;"></div>
  <div style="width: 36px;"></div>
  <div style="width: 36px;"></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
