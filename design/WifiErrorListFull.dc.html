    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }

    .dim-veil { background-image: radial-gradient(circle, #ffffff 1.3px, transparent 1.5px); background-size: 3px 3px; }

<!-- THE FOURTH SHAPE, AND THE ONLY ONE WHERE THE JOIN WORKED (#162).

     `SavedNetworks::remember()` holds eight networks and REFUSES the ninth
     rather than evicting the oldest, because evicting silently loses a
     password the reader typed and has no way to say so. Refusing LOUDLY was
     the point; the firmware refused SILENTLY -- the one caller threw the
     answer away, wrote the passphrase anyway, saved the unchanged eight, and
     left for the saved-network list on the argument that "the hub opening
     with the network in it IS the confirmation". On the ninth the hub opened
     without it and nothing anywhere said a word.

     THE CAPTION IS NOT `COULDN'T JOIN`, and that is the whole reason this is a
     board rather than a flag on another one. The radio came up, the AP
     accepted the passphrase, and the credential is PROVEN. Telling the reader
     the join failed would be the false-claim shape these three siblings exist
     to prevent, arriving from the other direction: `WifiErrorNotFound` refuses
     to say the password was rejected by a router that was not there, and this
     refuses to say a join failed that did not. `WallabagError` already varies
     its caption across shapes (`COULDN'T SIGN IN` / `COULDN'T CONNECT`), so
     the vocabulary is not new.

     `TRY AGAIN` AND `EDIT PASSWORD` ARE BOTH ABSENT, NOT INERT. The password
     is not what went wrong, so the first points the wrong way; and the cap is
     DETERMINISTIC, so the second would join, be refused identically and land
     back here -- a button that can only ever fail. `WallabagErrorNoNetwork`
     drops `TRY AGAIN` on exactly that argument ("the saved list does not
     change between two presses of a slab") and is the one-slab layout this
     board reuses. BookErrorMemory's lesson is the older spelling of it: DO NOT
     MAKE IT INERT.

     A REFUSAL WITH NO REMEDY READS AS A FAULT, so the sentence carries one.
     The cap is namable (eight) and the remedy is one hold away on the screen
     under the veil, which is where CANCEL and OK both land. `WallabagError`'s
     "Join one in Settings first." is the same sentence doing the same job.

     THE VEILED PARENT IS ITS THREE SIBLINGS' hub, with two saved rows rather
     than the eight the sentence names. That is deliberate: the four shapes are
     ONE screen and differ only in the dialog, so holding the background fixed
     is what lets `make compare` attribute a per-shape mismatch to the copy
     that changed. Redrawing the hub with eight rows would put it into its
     scrolling layout -- the rail and its 14px gutter -- and measure that
     instead. -->
