  <!--
    THE CONFIRM LABEL NAMES WHAT THE FOCUSED CELL DOES, and says NOTHING when
    the cell does nothing. Settings is the precedent and WifiSettings.dc.html
    is the second instance; this is the third, and it is the one where a fixed
    label is outright false.

    It reads TYPE above because the focused cell is a character -- which is
    what this board draws, so the rendered state does not move. It reads JOIN
    on the JOIN cell, SHIFT on SHIFT and #+= on #+=. A Confirm labelled TYPE
    that LEAVES THE SCREEN AND STARTS A JOIN is the misleading-button defect
    this project keeps recording, and it is the one thing a hint bar exists to
    prevent.

    AND JOIN IS NOT ALWAYS LIVE. A WPA2 passphrase is 8 to 63 characters
    (spec 4.1b), and this keyboard is only ever reached for a LOCKED network --
    an open one joins directly -- so pressing JOIN under eight characters
    cannot succeed. It would spend a radio round trip and put up a failure
    dialog to report a length the counter above is already showing.

    So the slot goes EMPTY there, which is this firmware's existing vocabulary
    rather than a new one: "a button with no action gets an empty slot", and an
    empty slot is 36px wide, not zero. The bar and the behaviour then agree,
    which is the whole rule -- the alternative is a cell that focuses and then
    ignores Confirm, the silent no-op this project has shipped twice.

    Note SPACE reads TYPE: it types a character like any other cell, and it is
    the only function key that does.

    AND BACK READS `BACK` ON AN EMPTY FIELD, where it reads DELETE above
    because the field has something in it. Reported off the device as "you
    can't go back from the password screen".

    Back DELETES here and a HELD Back leaves, which is spec 4.1b's wording --
    and on an EMPTY field there is nothing to delete, so the press did
    nothing at all under a bar promising DELETE. That is the dead button this
    firmware keeps recording, and it left the hold as the only way off a
    screen a reader can arrive at by accident.

    So on an empty field Back LEAVES, the slot reads BACK, and the hold ring
    comes OFF it -- a ring promises a DIFFERENT action, and there is no
    second action left to promise once the short press already leaves. With
    a character in the field the ring is back and the two are distinct
    again.

    This is the same rule as the Confirm slot one paragraph up, on the other
    side of the bar: the label names what the button does, and it does what
    the label says. The rendered state below is the non-empty one, so it
    keeps DELETE and its ring.
  -->
