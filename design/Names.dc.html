<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>

<!-- WHO'S THIS CHARACTER AGAIN.
     The names the book has used, up to where you have read, built by scanning each
     chapter as its pages are counted. Confirm opens a PEEK at the sentence that
     introduced the name -- there is no detail screen, which is the largest
     simplification in the feature: it deletes a screen, its board, and the need to
     store any sentence text on the card.

     IT SAYS NAMES, NOT CHARACTERS, AND THAT IS THE WHOLE HONESTY OF THIS SCREEN.
     A capitalisation-and-frequency heuristic on a 160 MHz part cannot tell a person
     from a place, and separating them needs a per-language word list -- a table
     core/ has twice refused to carry. So LOWICK and MIDDLEMARCH below are not
     defects, they are correct entries, and "where was Lowick again?" is a question
     readers ask too. Same move as the footer's em dash and the bare CH. 03: say the
     true thing rather than the impressive one.

     ALPHABETICAL, and that inverts the obvious order. Ranking by mentions puts the
     leads at the top -- and you never look up a lead. THE NAME YOU CANNOT PLACE IS
     RARE, so most-mentioned-first buries it hundreds of rows down and moves it as
     you read on. You always arrive knowing the string, because you just read it, and
     alphabetical is the only order where knowing it tells you where to look.

     TWO ROW HEIGHTS, WHICH IS SETTINGS' PROBLEM AND SETTINGS' SOLUTION. A person has
     a fuller form to show -- Ladislaw over WILL LADISLAW, often most of the answer
     before a peek is even opened -- and a place or an already-full name has nothing
     to put on a second line. Blank second lines on a third of the rows read as
     broken, so those rows are one line tall. The theme therefore reports the BOX
     MODEL (two heights) and the screen counts how many fit, exactly as
     settingsMetrics does, because the item table belongs to the screen.

     HOW MANY ROWS FIT IS A RESULT, AND THE SLACK BELOW THEM IS THE CHECK. Measured
     off this render: a two-line row is 90px, a one-line row 60px, and the list box
     is 671px. This board's mix -- five two-line and three one-line -- comes to
     630px, leaving 41px empty at the bottom. THAT IS CORRECT, not untidy: a
     ScrollWindow draws whole rows only, so with two row heights some slack is
     inevitable and it varies with which rows are on screen.
     What is NOT correct is slack of 60px or more, because then another row would
     have fitted -- and the first draft of this board had 132px of it, understating
     the screen by a whole row. The invariant to implement against and to check any
     future edit of this board with: SLACK < THE SHORTEST ROW HEIGHT.

     ALIASES MERGE BUT ARE NOT ALL SHOWN. The scan groups Stu, Stuart, Redman and
     Stuart Redman into one person -- that grouping is what lets Stu's peek open on
     "Stuart Redman, sans doute l'homme le plus tranquille d'Arnette" -- but printing
     the group reads as a database dump and does not fit 480px. One row, the form the
     book uses most, with the fullest form beneath. -->

<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <!-- THE BAND'S RIGHT SLOT IS COVERAGE, NOT A COUNT, and that is the one thing a
       reader might otherwise wonder about this screen: why someone is missing. The
       index knows only the chapters that have been read, which is what makes the
       feature spoiler-proof BY CONSTRUCTION rather than by a rule someone has to
       remember -- so the boundary is stated rather than left to be discovered.
       `300 NAMES` would restate the label and claim a precision the threshold makes
       arbitrary; the Library's slot counts books because a card really does hold
       twelve of them. -->
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 7px; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">NAMES</div>
    <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">TO CH. 07</div>
  </div>

  <!-- position: relative so the rail is placed against the LIST's own box, not the
       panel's: the header band and the hint bar do not scroll. -->
  <div style="position: relative; display: flex; flex-direction: column; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; flex-grow: 1; margin-right: 14px;">

      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Ladislaw</div>
          <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">WILL LADISLAW</div>
        </div>
      </div>

      <!-- A PLACE, one line tall. Nothing is hidden here and nothing is missing:
           Lowick is Casaubon's parish and the book names it constantly, so it earns
           its row on exactly the rule a person does. -->
      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="font-size: var(--t-body); font-weight: 500; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Lowick</div>
      </div>

      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Lydgate</div>
          <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">TERTIUS LYDGATE</div>
        </div>
      </div>

      <!-- FOCUSED, and full-bleed inverted as every list on this device draws it.
           One line because the display name IS the fullest form: the book calls her
           Mary Garth and there is nothing longer to reveal. Repeating it underneath
           would be the only thing worse than leaving it blank. -->
      <div style="display: flex; align-items: center; padding: 11px 24px; background: #000000; color: #ffffff;">
        <div style="font-size: var(--t-body); font-weight: 700; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Mary Garth</div>
      </div>

      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="font-size: var(--t-body); font-weight: 500; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Middlemarch</div>
      </div>

      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Raffles</div>
          <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">JOHN RAFFLES</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Rosamond</div>
          <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">ROSAMOND VINCY</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; padding: 11px 24px; border-bottom: 1px solid #000000;">
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Trumbull</div>
          <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">BORTHROP TRUMBULL</div>
        </div>
      </div>

    </div>

    <!-- THE RAIL, the Library's exactly: an outlined 6px track in a 14px gutter the
         rows do not enter, with a SOLID proportional thumb. Height is visible/total
         and top is first/total, in percent so both survive the reflow to 528x792.

         THE PROPORTION IS THE SPECIFICATION, so it has to be one only the rule could
         produce. This is 8 rows of 300 from row 148 -- 2.7% tall at 49.3% down -- and
         the thumb is therefore TINY, about 15px. That is not a defect to design
         around: it is the honest reading of a list forty times longer than the
         Library's, and the smallness is itself the information. A comfortable-looking
         thumb here would be a lie about how much list is above and below.

         The rail earns more here than on the Library, because the order is
         alphabetical: a thumb halfway down means roughly "around M", so it can be
         aimed rather than merely read. -->
    <div style="position: absolute; top: 6px; bottom: 6px; right: 4px; width: 6px; border: 1px solid #000000; box-sizing: border-box;">
      <div style="position: absolute; left: 0; right: 0; top: 49.3%; height: 2.7%; background: #000000;"></div>
    </div>

  </div>

  <!-- PEEK rather than OPEN or SELECT, because the word is the mechanism: it opens
       design/Peek.dc.html at the sentence that introduced this name, over the page
       you are on, and you come back with CLOSE. Naming it after the thing it does
       teaches the peek once and everywhere. -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">PEEK</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
