<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>

<!--
  HOME. The reading state, with the book's name on the spine.

  WHAT THIS REPLACED AND WHY. The previous layout stacked eight bands and two of
  them said one thing twice: measured at 480x800, the menu and hint bar owned
  307px (38% of the panel), the `6%` numeral and a progress bar owned 123px (15%)
  BOTH STATING THE SAME FRACTION, and the title -- the one fact this screen exists
  to state -- got 88px, two lines. The title had less room than the duplicated
  percentage. `A Portrait of the Artist as a Young Man` overflowed the board by
  529 ink pixels with the hint bar pushed off the glass; the firmware clamped to
  two lines and elided, which is the same fact wearing a different symptom.

  The spine takes the title out of that budget entirely and the progress BAR goes
  -- it and the numeral were the same fact, and the numeral was already the hero.

  THERE IS NO `NOW READING` BAND. The spine names the book, so a label saying a
  book is being read would title something already unmistakable, and the 2px rule
  under it would divide the spine from its own column. What survives is the
  battery, which is true on every screen.

  NO COVER. A dithered placeholder claims a picture this screen does not have, in
  the most prominent slot on the screen whose job is to name the book. An absent
  claim beats a false one. The spine takes the width the cover would have had.

  THE AUTHOR IS SHOUTED AT `--t-meta` because the spine has taken the naming job,
  so this run is metadata about it rather than the second line of a title block.

  THE CHAPTER ELIDES and may NOT wrap. The words come off the card and a real
  chapter name runs long; this column has no other growable run, and adding one
  would put a second thing competing for the height the spine exists to free.

  THE GAP BETWEEN CONTINUE AND THE MENU IS DELIBERATE. DO NOT CLOSE IT. It is
  196px on the X4 and 188 on the X3 and does NOT shrink when the title grows,
  because the title is no longer in this column. BookDetails.dc.html ships a 217px
  band of the same shape and reads as calm; on a fixed panel there is no fold and
  nothing below, so white space costs nothing. Four alternatives were drawn and
  measured: centring only redistributes it (263px of blank against 289), floating
  the menu up MAKES IT WORSE (a 194px hole at the foot, and the hint bar detached
  from the rows it labels), and a NEXT UP block closes it but needs data the
  device does not have -- no most-recent (nothing tracks it) and no newest
  (FileSystem carries no timestamps), the wall HomeUnopened.dc.html already hit.

  THE MENU ROWS ARE 74px, where the old layout used 80. That is what keeps three
  rows plus the hint bar inside the right column once the top band is gone. The
  row model is otherwise unchanged: a row states a quantity or discloses a screen,
  never both -- LIBRARY carries a count, ARTICLES carries `3 UNREAD` when there is
  something to report and the chevron otherwise, SETTINGS carries the chevron.
-->

<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; flex-grow: 1; min-height: 0;">
    <!-- THE SPINE. The book's name, set along the panel's long axis, which is
         what takes the title out of the competition for height: 692px of run per
         line on the X4 and 684 on the X3, wrapping to two, against the 608px two
         lines of the old 304px title column gave. `vertical-rl` plus a 180deg
         rotation sets it bottom-to-top, which is how a spine reads on a shelf.

         112px IS AN ALIGNMENT, NOT A TASTE, and it must stay divisible by 8.
         Under Rotation::Ccw the framebuffer maps physX = logY, so a full-height
         band at logical x in [0,112) is 112 CONSECUTIVE PHYSICAL ROWS -- which is
         what lets the firmware draw this into a scratch buffer at the same stride
         and move it with a memcpy, instead of rotating glyphs. A thickness that
         did not start on a byte boundary would force a per-pixel transpose, and a
         transpose is a byte-wise primitive carrying the rotation hazard this
         project has been bitten by five times.

         `overflow: hidden` on BOTH boxes is load-bearing: a title longer than two
         lines is clipped rather than allowed to escape into the hint bar, which
         is what the first draft did at both geometries. -->
    <div style="width: 112px; flex-shrink: 0; background: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 22px 0; overflow: hidden;">
      <div style="writing-mode: vertical-rl; transform: rotate(180deg); font-size: var(--t-title); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.12; max-height: 100%; overflow: hidden;">Middlemarch</div>
    </div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 7px; padding: 18px 24px 0 20px;">
        <div style="font-size: var(--t-value); font-weight: 700;">87%</div>
        <svg width="38" height="21" viewBox="0 0 22 12" fill="none"><rect x="0.5" y="0.5" width="18" height="11" stroke="#000000"></rect><rect x="2" y="2" width="14" height="8" fill="#000000"></rect><rect x="19.5" y="3.5" width="2" height="5" fill="#000000"></rect></svg>
      </div>
      <div style="padding: 26px 24px 0 20px;">
        <div style="font-size: var(--t-meta); letter-spacing: 0.2em;">GEORGE ELIOT</div>
        <div style="font-size: var(--t-display); font-weight: 700; line-height: 1; margin-top: 18px;">6%</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">I &middot; Miss Brooke</div>
      </div>
      <div style="padding: 26px 24px 0 20px;">
        <div style="background: #000000; color: #ffffff; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">
          <div style="font-size: var(--t-label); letter-spacing: 0.2em; font-weight: 500;">CONTINUE</div>
          <svg width="32" height="25" viewBox="0 0 18 14" fill="none"><path d="M1 7h15M11 1l6 6-6 6" stroke="#ffffff" stroke-width="2"></path></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; margin-top: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; height: 74px; padding: 0 24px 0 20px; border-top: 1px solid #000000;">
          <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">LIBRARY</div>
          <div style="font-size: var(--t-value); font-weight: 700;">12</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 74px; padding: 0 24px 0 20px; border-top: 1px solid #000000;">
          <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">ARTICLES</div>
          <div style="font-size: var(--t-value); font-weight: 700;">3 UNREAD</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; height: 74px; padding: 0 24px 0 20px; border-top: 1px solid #000000;">
          <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">SETTINGS</div>
          <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
        </div>
      </div>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="1.4"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="1.4"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">READ</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">SELECT</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
