<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">NOW READING</div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="font-size: var(--t-value); font-weight: 700;">87%</div>
      <svg width="38" height="21" viewBox="0 0 22 12" fill="none"><rect x="0.5" y="0.5" width="18" height="11" stroke="#000000"></rect><rect x="2" y="2" width="14" height="8" fill="#000000"></rect><rect x="19.5" y="3.5" width="2" height="5" fill="#000000"></rect></svg>
    </div>
  </div>

  <!-- NO COVER, AND THE READING COLUMN TAKES THE WHOLE WIDTH. This block used to
       open with a 112x168 `.dither-dots` panel: a stand-in for a cover image,
       drawn as a grey tint because there was no cover to draw. It was never a
       cover. It claimed a picture this screen does not have, in the most
       prominent slot on the screen whose whole job is to name the book being
       read -- and it took 128px of the 480px panel (112 plus the gap) away from
       the name to do it. An absent claim beats a false one, which is the call
       this design already makes for an unread battery gauge and for a badge
       promising a wake charging cannot deliver.

       THE `gap: 16px` WENT WITH IT, and that is not tidying. A flex `gap` sits
       BETWEEN items, so with one item left it separates nothing --
       BookErrorMemory.dc.html's own rule when its second slab was cut, where
       keeping the gap would have left 12px of dead air and pushed a centred
       panel off its centre. Here it would simply be a number with no meaning
       for the next reader of this file to wonder about.

       WHAT DOES *NOT* MOVE is the title's line budget. That budget is derived in
       renderHome from the room BELOW this block -- the bar, CONTINUE, the menu
       and the hint bar -- so it is a question about height, and the cover was a
       question about width. The name gets a wider column, not more lines. -->
  <div style="display: flex; padding: 30px 24px 0 24px;">
    <div style="display: flex; flex-direction: column; justify-content: flex-start; gap: 22px; flex-grow: 1; min-width: 0; padding: 2px 0;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
                <!-- IT WRAPS, and it used to elide. `text-overflow: ellipsis` with
             `white-space: nowrap` hid the end of any real book's name: the device
             showed a truncated title on the one screen whose whole job is to name
             the book you are reading, and the name is the content there.

             This is BookDetails.dc.html's rule, for BookDetails' reason -- an
             ellipsis on a LIST ROW hides only which of seven rows this is, and here
             it hides the thing the screen exists to say. `overflow-wrap: anywhere`
             because the break has to be allowed inside a word: a title falling back
             to a filename is usually one word, and CSS offers no break opportunity
             at an underscore or a hyphen.

             THE WRAP IS BOUNDED and the block below it does not move: the progress
             bar, CONTINUE, the menu and the hint bar are fixed, so the NAME yields.
             The bound is derived from the box model in renderHome, not pinned here. -->
        <div style="font-size: var(--t-title); font-weight: 700; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere;">Middlemarch</div>
        <div style="font-size: var(--t-body);">George Eliot</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: var(--t-display); font-weight: 700; line-height: 1;">6%</div>
        <!-- THE CHAPTER'S NAME, AND THIS LINE HAS NOW HELD THREE THINGS. It was two
             meta lines, `PAGE 53 / 890` above `CH. 01 &mdash; MISS BROOKE`, and
             neither was obtainable then: a page counter for the BOOK needs every
             chapter paginated (6.94 MB of inflated XHTML on a real novel, ~49 s of
             decode at this device's 7.2 ms/KB), and a chapter's name needed a table
             of contents that was not built.

             SO IT BECAME `CH. 01 OF 24` -- the spine position of the spine count --
             and that was a FALSE CLAIM, reported off an X3. A spine counts the cover,
             the title page, the copyright, the contents, the part dividers, the
             acknowledgements, the notes, the index and the about-the-author alongside
             the chapters, so the two numbers invite the reader to compute progress
             from quantities that are not chapters. One did: `47% &middot; CH. 14 OF 36`
             for a book of 7 chapters in 2 parts, and then Contents put them at part 2
             with five selectable rows left. Both readings cannot be true.

             Measured over 206 corpus books with a usable NCX: 126 (61.2%) have a
             spine count exceeding the spine entries their TOC names at all, worst
             164 against 26. And 183 (88.8%) have a spine count differing from the
             count of entries their TOC names as SELECTABLE chapters -- so no total
             this device can derive is a chapter count, which is why there is no
             total here rather than a better one.

             THE NAME IS THE ONLY HONEST ANSWER AND IT IS FREE NOW. Contents.dc.html
             is built and the Reader's header band already draws this exact string;
             the reading position stores it, so Home names the reader's chapter with
             the SAME words the Reader and Contents do. Numbering the TOC's own
             entries would be a third numbering system, which is the mistake the
             Contents row's right-hand slot was already fixed for.

             It takes the 0.10em this board gave the chapter line it used to draw,
             not the 0.16em of the counter that displaced it: a name is not a counter.
             AND IT ELIDES, because the words come off the CARD -- a real chapter name
             runs long ("PREMIERE PARTIE : A LIRE AVANT L'ACHAT") and this run has one
             line of a 304px column. That is the Reader header's own rule for the same
             string; the TITLE above is the run that wraps, because it is the thing the
             screen exists to say and a name here is a name for where you are. -->
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">I &middot; Miss Brooke</div>
      </div>
    </div>
  </div>

  <div style="padding: 26px 24px 0 24px;">
    <div style="width: 100%; height: 8px; border: 1px solid #000000; box-sizing: border-box;">
      <div style="width: 6%; height: 100%; background: #000000;"></div>
    </div>
  </div>

  <div style="padding: 26px 24px 0 24px;">
    <div style="background: #000000; color: #ffffff; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
      <div style="font-size: var(--t-label); letter-spacing: 0.2em; font-weight: 500;">CONTINUE</div>
      <svg width="32" height="25" viewBox="0 0 18 14" fill="none"><path d="M1 7h15M11 1l6 6-6 6" stroke="#ffffff" stroke-width="2"></path></svg>
    </div>
  </div>

  <!--
    THE ARTICLES ROW IS THE DOOR TO Articles.dc.html, AND IT WAS CUT WITH
    INSTAPAPER AND NEVER PUT BACK. `c2468df` (2026-08-20) removed it from this
    board and an `Instapaper / SIGNED IN` row from Settings' CONNECTIONS in the
    same commit, so the nine Articles boards have been a closed set reachable
    from NOTHING ever since -- the shape CLAUDE.md already records for V1.1,
    where "the six screens shipped with no door, every golden green, and make
    compare measuring Settings drifting AWAY from a board that was already
    right". Restored HERE rather than in Settings because this is the screen a
    reader is looking at when they want something to read.

    THE RIGHT SLOT STATES A COUNT ONLY WHEN THERE IS ONE, AND OTHERWISE
    DISCLOSES. components.h's rule is that a row states a quantity or discloses
    a screen, never both, and this menu already draws both shapes -- LIBRARY
    carries `12`, SETTINGS carries the chevron. A connected wallabag reads
    `3 UNREAD`; one that was never set up has no quantity to state and takes the
    chevron, which is HomeEmpty.dc.html's specimen. In the view-model that is
    the same distinction SETTINGS already makes, an empty `value`, so it needs
    no new field.

    IT IS NOT `NOT SET UP`, AND THE REASON IS WHO IS LOOKING. Most readers will
    never connect a wallabag, and a row telling them so would sit on the screen
    they see most often, every time, about a feature they did not ask for. An
    unconfigured row has nothing to report, so it reports nothing: the chevron
    makes it a door rather than a notice.

    WHAT IT COSTS IS THE TITLE'S BUDGET, AND THAT IS MEASURED RATHER THAN
    ESTIMATED. renderHome's `bottomAnchored` is
    `hintBarHeight + vm.menu.size() * kRowH`, so a third row takes kRowH (81px)
    off `blockRoom` and the title's line count falls out of the same arithmetic
    with nothing to update -- derived, not pinned, which is why this board is
    the whole change. Measured through the real renderHome at both geometries:
    `blockRoom` 346 -> 265 on the X4 and 338 -> 257 on the X3, so the budget
    goes 4 -> 2 lines and 3 -> 2. Two lines at this 304px column in shouted
    Title700 is about 24 characters -- `THE BROTHERS KARAMAZOV` fits and
    `A PORTRAIT OF THE ARTIST AS A YOUNG MAN` does not -- so a long title clamps
    where it used to wrap, which is the ellipsis #74 took off this screen
    arriving back at a greater length.

    THE TRADE WAS PRICED AND TAKEN BY THE OWNER: one always-present door is
    worth more than the fourth title line. **If it reads badly on glass the way
    back is not to shrink the row** -- it is to show ARTICLES only once articles
    exist and move the setup door to Settings' CONNECTIONS, which restores the
    other row c2468df cut and costs a reader who never connects one nothing.

    THIS BOARD NOW LEADS THE FIRMWARE, AND make compare SAYS SO LOUDLY -- READ
    IT AS THE DESIGN-FIRST RULE WORKING, NOT AS A REGRESSION. Until the row is
    implemented the firmware draws two menu rows where these three boards draw
    three, so the bottom-anchored menu sits 81px lower on the firmware's panel.
    Measured the moment the boards landed: `home` 1.23%/1.13% -> 1.98%/1.83%,
    and `home_empty` and `home_unopened` -> 20.96%/21.09% and 20.62%/20.78%.
    The two variants are the big ones for one reason -- their FOCUSED row is a
    full-bleed inverted block, ~38,000 px of solid ink, and it is counted twice
    when it sits in two places. **Those figures are expected to return to about
    what they were when the third row lands**, and a number that does not is the
    thing worth chasing. Nothing in CI reads them: the gate passes
    --require-implemented and --require-canvas-current, and neither is a
    fidelity check.

    THE MENU'S BOX IS UNCHANGED. The row is LIBRARY's own, copied rather than
    transcribed, so it cannot drift from the two beside it -- and copying the
    FOCUSED row is the mistake this pass made first, which put an inverted fill
    on two rows of HomeEmpty and HomeUnopened at once. The unfocused box comes
    from SETTINGS.
  -->
  <div style="display: flex; flex-direction: column; margin-top: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; border-top: 1px solid #000000;">
      <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">LIBRARY</div>
      <div style="font-size: var(--t-value); font-weight: 700;">12</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; border-top: 1px solid #000000;">
      <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">ARTICLES</div>
      <div style="font-size: var(--t-value); font-weight: 700;">3 UNREAD</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; border-top: 1px solid #000000;">
      <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">SETTINGS</div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="1.4"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="1.4"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">READ</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">SELECT</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
