<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">BOOK FINISHED</div>
  <!-- THE RIGHT SLOT IS EMPTY AND STILL RESERVED. It held the book's shouted name,
       which the BYLINE forty pixels below already states -- two spellings of one
       fact on one panel, and the redundant one was the one that broke: a long title
       squeezed BOOK FINISHED until the LABEL elided, so the screen stopped saying
       what it is. Reported off the device.
       But the BAND'S HEIGHT must not vary by screen: it is set by its two type
       roles, and a band that shrank when a screen left the slot empty would move
       every row beneath it. Chrome sizes a flex row by its children where the
       firmware's bandContentH() takes max(--t-label, --t-value) UNCONDITIONALLY, so
       deleting the div outright would shrink this band by 2px here and not there.
       The nbsp holds the --t-value line box. Same rule, and the same comment, as
       design/Typography.dc.html's band. -->
  <div style="font-size: var(--t-value); font-weight: 700;">&nbsp;</div>
</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 56px 24px 0 24px; text-align: center;">
    <svg width="26" height="21" viewBox="0 0 16 12" fill="none"><path d="M1 6l5 5L15 1" stroke="#000000" stroke-width="2"></path></svg>
    <div style="font-size: var(--t-title); font-weight: 700; letter-spacing: 0.08em;">THE END</div>
    <!-- IT WRAPS, and `anywhere` rather than `break-word` for BookDetails' reason:
         a title that fell back to a filename is usually one word, and CSS offers no
         break opportunity at an underscore. It ran off both margins on a real card
         until this said so. -->
    <div style="font-size: var(--t-value); font-weight: 500; overflow-wrap: anywhere;">Middlemarch &middot; George Eliot</div>
    <div style="font-size: var(--t-meta); letter-spacing: 0.14em;">24 CHAPTERS</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 36px 24px 0 24px;">
    <div style="background: #000000; color: #ffffff; height: 68px; display: flex; align-items: center; justify-content: center;">
  <div style="font-size: var(--t-value); letter-spacing: 0.18em; font-weight: 700;">MARK AS FINISHED</div>
</div>
    <div style="border: 2px solid #000000; box-sizing: border-box; height: 68px; display: flex; align-items: center; justify-content: center;">
  <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">BACK TO LIBRARY</div>
</div>
      </div>
  <div style="margin-top: auto; padding: 0 24px 14px 24px;">
    <div style="font-size: var(--t-meta); letter-spacing: 0.1em; line-height: 1.5;">MARKING AS FINISHED CLEARS IT FROM &ldquo;NOW READING&rdquo; ON HOME.</div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">SELECT</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
