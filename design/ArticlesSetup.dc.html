<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">ARTICLES</div>
  <div style="font-size: var(--t-value); font-weight: 700;">NOT SET UP</div>
</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 46px 24px 0 24px; flex-shrink: 1; min-height: 0; overflow: hidden; text-align: center;">
    <svg width="98" height="91" viewBox="0 0 28 26" fill="none"><rect x="4.5" y="0.5" width="19" height="3" stroke="#000000"></rect><rect x="2.5" y="6.5" width="23" height="3" stroke="#000000"></rect><rect x="0.7" y="12.7" width="26.6" height="12.6" stroke="#000000" stroke-width="1.4"></rect><path d="M4 17h14M4 20.5h20" stroke="#000000" stroke-width="1.2"></path></svg>
    <div style="font-size: var(--t-title); font-weight: 700; letter-spacing: 0.06em;">READ IT LATER</div>
    <div style="font-size: var(--t-body); line-height: 1.55; max-width: 400px;">Put the SD card in your computer and fill in your wallabag details in its /.reader/wallabag.json file.</div>
    <!--
      THIS FOOTNOTE SAID `SIGN-IN HAPPENS IN YOUR BROWSER &mdash; NOTHING TO TYPE
      ON THE DEVICE.` AND IT STOPPED BEING TRUE (#124).

      It was the one line on any board that was ACCURATE about the browser
      flow -- InstapaperConnect.dc.html's `PASSWORD STAYS IN THE BROWSER.` was
      stronger than the spec it came from and was false -- and it is exactly
      what the move to the keyboard falsifies. #115 settled that the xAuth
      exchange is an OAuth 1.0a HMAC-SHA1 SIGNED request, so whoever performs
      it holds the consumer secret and that cannot be a browser: the password
      reaches the firmware either way. With the safety claim gone the setup
      page was buying convenience with an HTTP server in firmware and a
      plain-HTTP hop across the LAN, so sign-in moved to the keyboard this
      device already ships. See docs/notes/instapaper-full-api.md SS6.

      THE SLAB STAYS AND NOW OPENS A KEYBOARD -- InstapaperUsername.dc.html,
      then InstapaperPassword.dc.html.

      WHAT THE REPLACEMENT MAY NOT SAY IS ANYTHING ABOUT SAFETY. The device
      really does discard the password once it holds the token, and putting
      that on a board would be the same class of promise this card exists to
      remove -- a security claim on glass, which nothing on the panel can keep
      the user informed about if it ever stops being true. So the line states
      the two MECHANICAL facts a reader needs before pressing: they will type,
      and it needs the radio.

      TWO LINES WHERE THE OLD ONE WAS THREE, so the centred block moves up
      rather than down; measured at 48 characters against the old 63 in the
      same 400px box.
    -->
    <div style="font-size: var(--t-meta); letter-spacing: 0.1em; line-height: 1.5; max-width: 400px;">THE FILE IS ALREADY ON THE CARD.</div>
  </div>
  <div style="margin-top: auto;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="width: 36px;"></div>
  <div style="width: 36px;"></div>
  <div style="width: 36px;"></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
