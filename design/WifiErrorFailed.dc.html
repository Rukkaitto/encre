       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel

    :root {

<!-- THE THIRD OF THREE FAILURE SHAPES. WifiError.dc.html is the first (the
     password was rejected) and WifiErrorNotFound.dc.html is the second (the AP
     never answered). This one is everything else.

     THE CASE IT NAMES: association succeeded -- the password was right and the
     router is there -- and the connection still did not complete. DHCP never
     returned an address is the common one; a router refusing the client for a
     reason of its own is the rest. From the reader's side these are one event,
     "it nearly worked", and there is nothing they can do differently, which is
     why they share a shape rather than getting one each.

     IT IS ALSO THE CATCH-ALL, and that is deliberate rather than lazy. A reason
     code the mapping does not recognise lands here, because "the connection
     didn't finish" is true of any failure past association and claims nothing
     specific -- where routing an unknown reason into one of the other two shapes
     would assert a cause nobody established. An unknown that degrades into a
     vaguer TRUE sentence is the safe direction; one that degrades into a
     confident wrong one is the defect this three-way split exists to close.

     NO `EDIT PASSWORD`, for WifiErrorNotFound's reason: the password was
     accepted, so offering to change it points the wrong way. Absent, not inert
     -- BookErrorMemory.dc.html's precedent, and its lesson verbatim.

     `TRY AGAIN` FILLED AND FOCUSED. A DHCP timeout is the single most
     retry-responsive failure on this list: a busy router that did not hand out a
     lease in time very often does on the next attempt. -->
