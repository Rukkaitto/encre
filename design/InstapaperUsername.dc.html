    3px gaps, the 40x52 cell, the 427px row width (ten keys and nine gaps), the
    six function cells at 40/40/83/60/95/94, the 76px field box with its 2px
    border and its 10x34 caret 3px from the text, the counter row's 10px top
    padding, and the hint bar.

    WHAT DIFFERS, and each difference is a parameter rather than a redraw:
    the band's two runs, ONE new element (the field label below), the Confirm
    cell's word, and -- on the password board -- the counter row's right slot.

    THE FIELD LABEL IS A SECTION HEADER, NOT A NEW PRIMITIVE. `--t-meta` at
    0.2em/500 on `padding: 18px 24px 6px 24px` is Settings.dc.html's
    `SAVED NETWORKS` box to the pixel, which is components.h's
    `drawSectionHeader` with its rule suppressed. It exists because the band
    cannot hold these two strings: measured against the firmware's own ramp,
    `EMAIL OR USERNAME` is 314px at Label500/0.22em and `PASSWORD, IF YOU HAVE
    ONE` would be wider still, against 432px of band shared with a value. At
    Meta500/0.2em they are 281px and 389px, so both fit one line with room.

    THE BAND IS `SIGN IN` / WHICH ACCOUNT. That is WifiPassword's own right-slot
    semantics -- `PENDRAGON` there answers "which network is this secret for" --
    with the flow's name on the left, because the field's name has moved to the
    label. The username board has no account yet, so it names the service
    instead; the password board names the account you are signing in as, which
    is the review a two-screen flow would otherwise not have.

    THE VALUE CARRIES `min-width: 0`, WHICH IS HOW A BOARD SAYS WHICH RUN
    YIELDS (#82). An address off a real card can be any length, and the run
    naming the screen may never elide, so the account is the run that gives way.
    The committed specimen fits -- `SIGN IN` + `LUCAS@EXAMPLE.COM` measures
    400px of 432 -- exactly as Contents.dc.html's `MIDDLEMARCH` fits: the
    declaration states the rule the specimen cannot show.

</div>

    usernames are not email addresses." The device cannot tell which one a
    reader has, so the label must admit both.

    THE SPECIMEN IS AN ADDRESS BEING TYPED, head not yet finished, which is
    WifiPassword's `correcthor` idiom. It is deliberately an address rather
    than a bare username because that is the case with a cost: `@` is not on

    two presses on top of the 92 SS6 counted for this field.

    THE CONFIRM CELL IS `NEXT`, WHICH IS ALSO WHAT TELLS THE READER THERE IS A
    SECOND FIELD. That is the one thing a two-screen flow owes a reader, and
    it is paid by the word on the cell rather than by a step counter in the
    band -- this project has a rule about counters that invite an arithmetic
    the numbers do not support.

    IT IS INERT ON AN EMPTY FIELD, AND THE CONFIRM SLOT GOES EMPTY WITH IT,
    which is this firmware's existing vocabulary rather than a new one.
    Instapaper's xAuth exchange cannot succeed without a username, so `NEXT`
    with nothing typed would advance to a password field for an account that
    does not exist and fail two screens later.

    NOTE THE ASYMMETRY WITH THE PASSWORD BOARD, AND THAT IT IS DERIVED.

    ZERO there -- both read off Instapaper rather than off 802.11.
    `kMinPassphrase = 8` is the Wi-Fi caller's and must not come along (#126).

    against `JOIN`'s 56, and the cell is 94px, so the function row is
    WifiPassword's 40/40/83/60/95/94 unchanged.
