<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    .dither-dots { background-color: #ffffff; background-image: radial-gradient(circle, #000000 1.1px, transparent 1.3px); background-size: 4px 4px; }
    .dither-dots-inv { background-color: #000000; background-image: radial-gradient(circle, #ffffff 1.1px, transparent 1.3px); background-size: 4px 4px; }
    .dim-veil { background-image: radial-gradient(circle, #ffffff 1.3px, transparent 1.5px); background-size: 3px 3px; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; position: relative;">

  <!--
    THE VEIL SHOWS WifiSettings, AND IT USED TO SHOW THE ARTICLES LIST.

    That was an Instapaper leftover, and a stale one: c2468df cut Instapaper
    from V1, rewrote this dialog's two strings ("to sync articles" became "to
    receive books") and never touched the background behind them. So the one
    modal that says the device is joining a network to receive books was drawn
    over a screen this firmware does not have and will not build.

    WifiSettings is right for a reason stronger than "it is where you came
    from". The connecting dialog REPLACES the join stack rather than sitting on
    it -- Action::replace, which pushes before it erases so a refused factory
    leaves the stack intact -- and that is what makes one veiled parent
    truthful for BOTH entry paths: a locked network arrives here from
    WifiPassword and an open network arrives straight from WifiPicker, since
    "OPEN NETWORKS JOIN DIRECTLY". An open network has no WifiPassword to veil.
    WifiError.dc.html already veils this same screen, so the pair agrees.

    ROWS ARE 80px HERE, MATCHING WifiSettings.dc.html. The veil is what the
    firmware actually draws underneath -- App::render walks down to the topmost
    non-overlay, paints it, then paints the overlay over it -- so a veiled
    parent that disagrees with the real screen is a mismatch make compare will
    measure, however invisible it looks under the stipple.
  -->
  <div style="position: absolute; top: 0; left: 0; width: 480px; height: 800px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">WI-FI</div>
  <div style="font-size: var(--t-value); font-weight: 700;">ON DEMAND</div>
</div>
  <!-- THE `Wi-Fi stays off. It connects only while receiving books` BLOCK IS
       GONE. It explained the on-demand radio to a reader who never asked and
       cannot change it: the device's behaviour is the same whether or not
       they read it, so the block was a paragraph of chrome bought with the
       top of every screen that veils this one. Cut on the owner's call --
       "either obvious or the user doesn't need to know them" -- which is the
       same judgement that took the eight-cell ticker off WifiConnect.

       The header band's `ON DEMAND` already states the policy in two words,
       in the slot that exists for a screen's state. -->
  <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">SAVED NETWORKS</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; background: #000000; color: #ffffff;">
    <div style="font-size: var(--t-value); font-weight: 700;">HOME</div>
    <div style="font-size: var(--t-value); font-weight: 700;">AUTO</div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px;">
    <div style="font-size: var(--t-value); font-weight: 500;">BUREAU</div>
    <div style="font-size: var(--t-value); font-weight: 700;">SAVED</div>
  </div>
  <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">SETUP</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px;">
    <div style="font-size: var(--t-value); font-weight: 500;">Join another network&hellip;</div>
    <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
  </div>
  </div>
  <div class="dim-veil" style="position: absolute; top: 0; left: 0; width: 480px; height: 800px;"></div>
  <div style="position: absolute; top: 50%; transform: translateY(-50%); left: 70px; width: 340px; background: #ffffff; border: 2px solid #000000; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 21px 20px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">CONNECTING&hellip;</div>
  <div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">WI-FI</div>
</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 20px 24px 20px; text-align: center;">
    <svg width="60" height="46" viewBox="0 0 24 18" fill="none"><path d="M1 6a16 16 0 0 1 22 0" stroke="#000000" stroke-width="1.8"></path><path d="M4.5 9.5a11 11 0 0 1 15 0" stroke="#000000" stroke-width="1.8"></path><path d="M8 13a6.3 6.3 0 0 1 8 0" stroke="#000000" stroke-width="1.8"></path><circle cx="12" cy="16" r="1.6" fill="#000000"></circle></svg>
    <!--
      THE EIGHT-CELL TICKER IS GONE, and it was the only thing on this panel
      claiming a measurement.

      Three of eight reads as a fraction of a known total. A join takes an
      unknown one to ten seconds, and NOTHING ON THIS DEVICE ANIMATES -- every
      advance would be a ~520 ms waveform, so a ticker either sits still and
      states a progress it never measured, or it buys two seconds of panel time
      in front of somebody already waiting. That is the call this project
      already makes for the reader's page total, drawn as an em dash rather
      than a zero, and for the battery gauge answering -1 rather than 0%: AN
      ABSENT CLAIM BEATS A FALSE ONE.

      The label is the whole indicator. CONNECTING... steps to READY -- two
      paints for a successful join -- and the ellipsis is already the
      indeterminate mark.

      COPY: BOTH SENTENCES NAMED A TRANSFER THIS RELEASE DOES NOT HAVE. V1.1 is
      the connect flow only, so nothing here receives books yet; the join
      exists to prove the credential. "to receive books" became "to check the
      password", which is what the press actually does. And "WHEN THE TRANSFER
      FINISHES" became "AGAIN WHEN THIS FINISHES" -- deliberately, because that
      is true now AND stays true when transfer lands, so the sentence does not
      have to be rewritten twice.
    -->
    <div style="font-size: var(--t-value); font-weight: 500;">Joining &ldquo;HOME&rdquo; to test the password.</div>
    <div style="font-size: var(--t-meta); letter-spacing: 0.1em; line-height: 1.5;">WI-FI TURNS OFF AGAIN AFTERWARDS.</div>
  </div>
  </div>
<div style="position: absolute; bottom: 0; left: 0; width: 100%; background: #ffffff; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">CANCEL</div></div>
  <div style="width: 36px;"></div>
  <div style="width: 36px;"></div>
  <div style="width: 36px;"></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
