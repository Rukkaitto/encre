<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <!-- The one header band on any board whose LABEL is data: it reads LIBRARY at
       the root and a subfolder's own name below it, and a folder on a real card
       is named whatever it is named. So the label truncates and the count keeps
       its width, and the `gap: 7px` is the minimum separation between them --
       without it `space-between` lets the ellipsis touch the count the moment
       the label fills the line. Every other band's label is a literal
       (NOW READING, ABOUT THIS BOOK), which is why they state neither.

       NO GUTTER ON THIS BOARD, because there is no rail on it. The rows run to
       the panel edge and the focused row's fill touches the border.

       Reserving the gutter here was tried and is wrong. The argument for it was
       that a list crossing seven books would otherwise reflow -- every
       right-aligned value stepping 14px left the moment an eighth arrived. True,
       but it happens ONCE, at the same moment the rail appears, which explains
       the shift rather than looking broken. The reserved-but-empty gutter is
       visible always, and a white strip beside a full-bleed black row reads as a
       rendering fault. A defect you see every time beats a reflow you see once.
       See LibraryScrolled for the rail and why it needs a column at all.

       THE RIGHT SLOT STAYS THE BOOK COUNT ON THIS BOARD, because this list does
       NOT overflow: one folder plus six books is exactly the seven rows that fit.
       A scroll position belongs on the board for the state that has one, which is
       LibraryScrolled -- the same way Home's empty and missing-book states are
       their own boards rather than variants annotated on this one.

       And the two numbers are NOT the same number, which is the trap. `12 BOOKS`
       counts books ONE LEVEL DOWN -- six here plus the six the folder row labels
       -- while a scroll position counts ROWS IN THIS LIST, of which there are
       seven. They coincide on a flat library and diverge the moment a folder
       exists, so a range reading `1-7 OF 12` is not a wording problem, it is two
       units in one expression. -->
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 7px; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">LIBRARY</div>
    <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">12 BOOKS</div>
  </div>

  <!-- A BOOK ROW GETS THE BOOK MARK, WHERE IT USED TO GET A PLACEHOLDER COVER.
       Every book row opened with a 44x64 `.dither-dots` panel and a 1px border
       (2px white when focused) -- a grey tint standing in for a cover image that
       is never decoded here. Two things were wrong with it. It claimed a picture
       the row does not have, and at 44x64 with a border it was the heaviest mark
       on the screen: six near-identical grey blocks down the left edge, carrying
       no information at all, since every book row had the same one.

       THE TWO ROW KINDS NOW SHARE ONE SHAPE, which is the real gain. A folder row
       has always drawn a bare centred mark in a 44x64 slot with no border, so the
       book row is now the folder row with a different mark -- and renderLibrary
       collapses to one expression choosing between them, where it had two
       branches free to place their marks differently.

       THE SLOT IS UNCHANGED AT 44x64, deliberately: `bookRowContentH` is
       `max(kBookThumbH, the text column)`, so the row's height and therefore the
       whole list's geometry are a function of that slot. Shrinking it to the
       mark's own 25px would move every row on every Library screen for a reason
       that has nothing to do with rows.

       THE MARK IS 44x44, NOT THE 25x25 THE `READ` HINT DRAWS, AND THE FOLDER
       BESIDE IT IS WHY. A folder row's mark is 44x39 -- it fills the slot's width
       -- so a book at 25x25 read distinctly lighter than a folder in the same
       column, one row above it, and that asymmetry was never designed: it was
       which assets happened to exist. Matched by STROKE rather than by box, which
       is what "the same weight" means for two marks of different aspect: the
       folder's `stroke-width: 1.8` over a 26-unit viewBox at 44px is 3.05 device
       px, and 1.1 over a 16-unit viewBox at 44px is 3.03. 1.1 is the two-decimal
       value nearest the exact 1.108, and the two strokes land 0.02 px apart.

       IT IS A SECOND ASSET, NOT A RESIZE, and the callers decide that rather than
       taste: these are pre-rendered bitmaps, so 25px and 44px are two of them,
       and `kBook` at 25px is still drawn by the `READ` hint on Main, HomeCharging
       and HomeMissing. kBook/kBookLarge is the same split at 25 and 112, and
       kBattery/kBatteryCharging is it for two states. 484 bytes of flash.

       WHICH INSTANCE THE GENERATOR READS IS THE FOCUSED ROW'S, and it has to be:
       iconc.py's `match` must locate exactly one vector element or it exits rather
       than guessing, and this board draws SIX identical book paths. The focused
       row's is the only one authored in white -- it is the one all-white mark on
       this board -- so the match keys on the book's own spine path AND its paint.
       That is `hold`'s shape rather than a new idea: it keys on the dot's radius
       drawn hollow, geometry plus a paint attribute, because paint is what tells
       the ring from the filled dot. extract() re-colours an all-white mark to
       black, kForward's precedent, so the white authoring rasterises to the same
       coverage bytes. Keep the focused row white and keep it the only white mark
       here, or the match stops being unique and the run fails loudly.

       AND DO NOT WRITE A LITERAL VECTOR OPEN TAG IN A COMMENT ON THIS BOARD. The
       first draft of this note spelled one out in prose; iconc.py scans for that
       tag with a non-greedy regex and no HTML parser, so the note itself became an
       element that swallowed the real markup after it -- and the run failed on
       `hold` matching twice, on a board nobody had touched. Same shape as the
       replace that hit the note quoting the string it documented: a comment
       quoting a token the tooling searches for IS an occurrence of it. -->

      <div style="width: 44px; height: 64px; display: flex; align-items: center; justify-content: center;">

      </div>

    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; background: #000000; color: #ffffff;">
      <div style="width: 44px; height: 64px; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#ffffff" stroke-width="1.1"></path><path d="M8 3.2v11" stroke="#ffffff" stroke-width="1.1"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Middlemarch</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">GEORGE ELIOT</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">6%</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; border-bottom: 1px solid #000000;">
      <div style="width: 44px; height: 64px; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="1.1"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="1.1"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">

      <div style="width: 44px; height: 64px; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="1.1"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="1.1"></path></svg></div>

    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px;">
      <div style="width: 44px; height: 64px; display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="1.1"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="1.1"></path></svg></div>

      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">NEW</div>
    </div>

  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
