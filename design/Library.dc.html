<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    .dither-dots { background-color: #ffffff; background-image: radial-gradient(circle, #000000 1.1px, transparent 1.3px); background-size: 4px 4px; }
    .dither-dots-inv { background-color: #000000; background-image: radial-gradient(circle, #ffffff 1.1px, transparent 1.3px); background-size: 4px 4px; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <!-- The one header band on any board whose LABEL is data: it reads LIBRARY at
       the root and a subfolder's own name below it, and a folder on a real card
       is named whatever it is named. So the label truncates and the count keeps
       its width, and the `gap: 7px` is the minimum separation between them --
       without it `space-between` lets the ellipsis touch the count the moment
       the label fills the line. Every other band's label is a literal
       (NOW READING, ABOUT THIS BOOK), which is why they state neither.

       THE RAIL'S GUTTER IS RESERVED HERE TOO, and that is the point of it being a
       gutter: the rows stop 14px short of the panel whether or not a rail is
       drawn. Reserving it only when the list overflows would reflow every row the
       user already had the moment an eighth book arrived -- every right-aligned
       value stepping 14px left because a book was added. See LibraryScrolled for
       the rail itself and why it cannot live in the outer margin.

       THE RIGHT SLOT STAYS THE BOOK COUNT ON THIS BOARD, because this list does
       NOT overflow: one folder plus six books is exactly the seven rows that fit.
       A scroll position belongs on the board for the state that has one, which is
       LibraryScrolled -- the same way Home's empty and missing-book states are
       their own boards rather than variants annotated on this one.

       And the two numbers are NOT the same number, which is the trap. `12 BOOKS`
       counts books ONE LEVEL DOWN -- six here plus the six the folder row labels
       -- while a scroll position counts ROWS IN THIS LIST, of which there are
       seven. They coincide on a flat library and diverge the moment a folder
       exists, so a range reading `1-7 OF 12` is not a wording problem, it is two
       units in one expression. -->
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 7px; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">LIBRARY</div>
    <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">12 BOOKS</div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; flex-grow: 1; margin-right: 14px;">

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; border-bottom: 1px solid #000000;">
      <div style="width: 44px; height: 64px; display: flex; align-items: center; justify-content: center;">
        <svg width="44" height="39" viewBox="0 0 26 22" fill="none"><path d="M1 4a2 2 0 0 1 2-2h6l3 3h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4z" stroke="#000000" stroke-width="1.8"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Classics</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">FOLDER &middot; 6 BOOKS</div>
      </div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; background: #000000; color: #ffffff;">
      <div class="dither-dots-inv" style="width: 44px; height: 64px; border: 2px solid #ffffff; box-sizing: border-box;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Middlemarch</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">GEORGE ELIOT</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">6%</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; border-bottom: 1px solid #000000;">
      <div class="dither-dots" style="width: 44px; height: 64px; border: 1px solid #000000; box-sizing: border-box;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Jane Eyre</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">CHARLOTTE BRONT&Euml;</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">DONE</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; border-bottom: 1px solid #000000;">
      <div class="dither-dots" style="width: 44px; height: 64px; border: 1px solid #000000; box-sizing: border-box;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Walden</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">HENRY DAVID THOREAU</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">48%</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; border-bottom: 1px solid #000000;">
      <div class="dither-dots" style="width: 44px; height: 64px; border: 1px solid #000000; box-sizing: border-box;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Meditations</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">MARCUS AURELIUS</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">NEW</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px; border-bottom: 1px solid #000000;">
      <div class="dither-dots" style="width: 44px; height: 64px; border: 1px solid #000000; box-sizing: border-box;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Dubliners</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">JAMES JOYCE</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">31%</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 11px 24px;">
      <div class="dither-dots" style="width: 44px; height: 64px; border: 1px solid #000000; box-sizing: border-box;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
        <div style="font-size: var(--t-body); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">The Odyssey</div>
        <div style="font-size: var(--t-meta); letter-spacing: 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">HOMER &middot; TR. BUTLER</div>
      </div>
      <div style="font-size: var(--t-value); font-weight: 700; white-space: nowrap;">NEW</div>
    </div>

    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">OPEN</div><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="none" stroke="#000000" stroke-width="1"></circle></svg></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
