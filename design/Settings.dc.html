<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">SETTINGS</div>
    <div style="font-size: var(--t-value); font-weight: 700;">V 0.1.0</div>
  </div>

  <!-- SETTINGS FITS AGAIN, and the history is worth keeping because it may not
       stay that way.

       Adding the `Refresh on screen change` row DEVICE needed took the content
       past 800px and clipped the hint bar, so this board became a scrolling list
       with Library's rail in a 14px gutter. Then Wi-Fi was cut from V1 -- card
       transfer only -- and CONNECTIONS went with it: eleven items where twelve fit.
       So the rail and its gutter came back off, and the rows run to the panel edge.

       Phase 3's typography settings will push it over again. When they do, the rail
       returns and `renderSettings` already asks rather than assumes -- it reads
       `totalRows > rows` and takes the gutter only if the rail is drawn, which is
       why nothing but this board had to change. -->
  <div style="display: flex; flex-direction: column; flex-grow: 1;">

    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">TYPOGRAPHY</div>
    <!-- NOT the focused row, and that is the decision showing. Focus SKIPS rows
         with nothing behind them, so TYPOGRAPHY cannot hold it until Phase 3's
         reader gives these settings something to change. This board focused Font
         before that was settled; leaving it there would have documented behaviour
         the firmware deliberately does not have, and mismatched `make compare`
         forever on which row is inverted. An inert row is drawn exactly like an
         unfocused focusable one -- there is no dimming, because a visual
         difference nobody designed is worse than no difference. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Font</div>
      <div style="font-size: var(--t-value); font-weight: 700;">LITERATA</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Size</div>
      <div style="font-size: var(--t-value); font-weight: 700;">18 PT</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Margins</div>
      <div style="font-size: var(--t-value); font-weight: 700;">COMFORTABLE</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Line spacing</div>
      <div style="font-size: var(--t-value); font-weight: 700;">1.7</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 500;">Alignment</div>
      <div style="font-size: var(--t-value); font-weight: 700;">JUSTIFIED</div>
    </div>

    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px; border-top: 2px solid #000000;">DEVICE</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; background: #000000; color: #ffffff; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 700;">Sleep after</div>
      <div style="font-size: var(--t-value); font-weight: 700;">10 MIN</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Full refresh</div>
      <div style="font-size: var(--t-value); font-weight: 700;">EVERY 15 PAGES</div>
    </div>
    <!-- THE SECOND REFRESH SETTING, and it is a separate one from the row above.
         `Full refresh` is a periodic CADENCE (every Nth paint, 0 = never); this is
         whether a SCREEN CHANGE takes the full waveform so the outgoing screen
         cannot ghost through. The firmware ships the cadence off and the
         transition on, which is neither the reference firmware's behaviour nor the
         obvious one, so it needs to be a row the user can see and reverse -- see
         the roadmap for the measurement (~825 ms against ~520 ms) and the argument.

         Next to the cadence rather than at the end of DEVICE, because a reader
         hunting for "why does my screen flash" should find both answers together
         rather than one here and one three rows down.

         The longest label in this column by some way. At --t-value 500 it measures
         ~300px of the X4's 480, leaving the value's ~30px and the 48px of padding
         comfortably -- the pair to beat is `Full refresh` + `EVERY 15 PAGES`, which
         is wider overall. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Refresh on screen change</div>
      <div style="font-size: var(--t-value); font-weight: 700;">ON</div>
    </div>
    <!-- No `border-bottom`: this is the last row of DEVICE and CONNECTIONS' own
         `border-top` is the line between them. Giving it one made a 3px slab where
         the board elsewhere draws 2 -- `Alignment`, the last row of TYPOGRAPHY,
         has none for the same reason. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 500;">Sleep screen</div>
      <div style="font-size: var(--t-value); font-weight: 700;">BOOK COVER</div>
    </div>

  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">CHANGE</div></div>
    <div style="display: flex; align-items: center; gap: 6px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 6px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
