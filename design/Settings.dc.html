<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">SETTINGS</div>
    <div style="font-size: var(--t-value); font-weight: 700;">V 0.1.0</div>
  </div>

  <!-- SETTINGS FITS AGAIN, and the history is worth keeping because it may not
       stay that way.

       Adding the `Refresh on screen change` row DEVICE needed took the content
       past 800px and clipped the hint bar, so this board became a scrolling list
       with Library's rail in a 14px gutter. Then Wi-Fi was cut from V1 -- card
       transfer only -- and CONNECTIONS went with it: eleven items where twelve fit.
       So the rail and its gutter came back off, and the rows run to the panel edge.

       Phase 3's typography settings will push it over again. When they do, the rail
       returns and `renderSettings` already asks rather than assumes -- it reads
       `totalRows > rows` and takes the gutter only if the rail is drawn, which is
       why nothing but this board had to change. -->
  <div style="display: flex; flex-direction: column; flex-grow: 1;">

    <!-- READING, not TYPOGRAPHY, and it is one row where it was five.
         The five rows (Font, Size, Margins, Line spacing, Alignment) were drawn
         here and unreachable, because the settings behind them did not exist.
         They do now, and they are edited on their own screen
         (design/Typography.dc.html) -- which needs no open book, so Settings can
         reach it. Five readout rows nobody could act on are the wrong answer once
         there is a door.
         READING rather than TYPOGRAPHY so the section is a sibling of DEVICE and
         has room for the other reading settings that are coming (hyphenation, page
         turn direction) -- and so the header does not repeat the row's own word. -->
    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">READING</div>
    <!-- AND THE CONFIRM HINT READS `OPEN`, NOT `CHANGE`, WHILE THIS ROW IS
         FOCUSED. screen_settings.cpp used to state the premise outright -- "CHANGE,
         not OPEN: nothing here pushes a screen, every focusable row edits a value
         in place" -- and this row makes it false. So the label follows the FOCUSED
         ROW: `OPEN` here, `CHANGE` on the four DEVICE rows, which is the only way
         the bar can be true of the button it describes. One slot changes as the
         focus moves; a Confirm labelled CHANGE that opened a screen would be the
         misleading-button defect this project keeps recording.
         This board depicts the initial state, so it shows OPEN. -->
    <!-- THE FOCUS STARTS HERE, because this is now the first row with anything
         behind it. It moved off `Sleep after` below, which held it only because
         every row above it was inert.
         A CHEVRON AND NO VALUE: this row discloses a screen, and Home's menu rows
         state the rule -- a row states a quantity or discloses a screen, never
         both. Summarising five settings in the right slot would break it and would
         not fit. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; background: #000000; color: #ffffff; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 700;">Typography</div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#ffffff" stroke-width="2"></path></svg>
    </div>

    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px; border-top: 2px solid #000000;">SLEEP SCREEN</div>
    <!-- `Shows`, NOT `Sleep screen`. The board already states the rule that names
         this row: READING was chosen over TYPOGRAPHY so a section does not repeat
         the row's own word directly above it. Under this header it reads as a
         sentence -- sleep screen, shows, cover + details.

         The value cycles COVER -> COVER + DETAILS -> DETAILS and wraps. COVER draws
         the cover full-bleed and NO BADGE: a full-bleed cover is not a screen the
         device can otherwise be in, so it is unambiguous by itself, where a Library
         or a half-read page is not. Every fallback puts the badge back.

         `COVER + DETAILS` is the widest value this section states. Measured on the
         480-wide X4 -- the narrower panel, so the one that fails first -- it clears
         its label by 154px, against 113px for `Full refresh` + `EVERY 15 PAGES` and
         85px for `Refresh on screen change` + `ON`. Note the GAP is the measure
         here, not the ink extent: `space-between` pins every row to both margins,
         so all six rows span 24..455 whatever they say. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Shows</div>
      <div style="font-size: var(--t-value); font-weight: 700;">COVER + DETAILS</div>
    </div>
    <!-- FILL crops to the panel, WHOLE letterboxes and tints the bands with the
         same level-1 clustered dither Sleep.dc.html uses as its field -- white
         bands read as unpainted glass.

         Deliberately NOT `FILL` / `FIT`: one letter apart is bad at 25px on this
         glass.

         The row is focusable only while `Shows` shows a cover, DERIVED rather than
         tabulated -- Typography's own precedent, where `Font` is unreachable while
         one body face is vendored.

         Measured: 163 of 224 corpus covers are 2:3, and the X3 is 2:3 exactly, so
         this is a no-op for 73% of books on that panel. It earns itself on the X4
         (10% median loss) and on the tail -- the squarest corpus cover is 877x973
         and FILL cuts its title off at both edges.

         No `border-bottom`: last row of SLEEP SCREEN, and DEVICE's own `border-top`
         is the line between them. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 500;">Cover fit</div>
      <div style="font-size: var(--t-value); font-weight: 700;">FILL</div>
    </div>

    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px; border-top: 2px solid #000000;">DEVICE</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Sleep after</div>
      <div style="font-size: var(--t-value); font-weight: 700;">10 MIN</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Full refresh</div>
      <div style="font-size: var(--t-value); font-weight: 700;">EVERY 15 PAGES</div>
    </div>
    <!-- THE SECOND REFRESH SETTING, and it is a separate one from the row above.
         `Full refresh` is a periodic CADENCE (every Nth paint, 0 = never); this is
         whether a SCREEN CHANGE takes the full waveform so the outgoing screen
         cannot ghost through. The firmware ships the cadence off and the
         transition on, which is neither the reference firmware's behaviour nor the
         obvious one, so it needs to be a row the user can see and reverse -- see
         the roadmap for the measurement (~825 ms against ~520 ms) and the argument.

         Next to the cadence rather than at the end of DEVICE, because a reader
         hunting for "why does my screen flash" should find both answers together
         rather than one here and one three rows down.

         The longest label in this column by some way. At --t-value 500 it measures
         ~300px of the X4's 480, leaving the value's ~30px and the 48px of padding
         comfortably -- the pair to beat is `Full refresh` + `EVERY 15 PAGES`, which
         is wider overall. -->
    <!-- No `border-bottom`, and it LOST one when the inert `Sleep screen` row below
         it was cut. That row drew `BOOK COVER` with nothing behind it (issue #11);
         the setting is real now and lives in SLEEP SCREEN above, as two rows that
         act.

         This row is therefore the last row of DEVICE *and* the last drawn row, so
         the rule reaches it twice over. If a section is ever added below DEVICE,
         this stays as it is -- that section's own `border-top` becomes the line
         between them, exactly as SLEEP SCREEN's is for `Typography` and DEVICE's is
         for `Cover fit`. Giving it one makes a 3px slab where the board elsewhere
         draws 2, and it also advances `y`, which is what once put every row below a
         header a pixel low -- the reported symptom being the doubled line at the
         top, the smaller of the two defects. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 500;">Refresh on screen change</div>
      <div style="font-size: var(--t-value); font-weight: 700;">ON</div>
    </div>

    <!-- CONNECTIONS IS BACK, and the row above predicted exactly this: 53c92d4
         cut this section with Wi-Fi, and the note on `Refresh on screen change`
         says "If a section is ever added below DEVICE, this stays as it is --
         that section's own `border-top` becomes the line between them". It does,
         so that row is untouched and this header carries the 2px.

         IT DOES NOT START THE LIST SCROLLING, which is the thing to check rather
         than assume, because losing this section is what stopped it. The history:
         `Refresh on screen change` took the content past 800px and the board grew
         Library's rail in a 14px gutter; cutting CONNECTIONS brought it to eleven
         items where twelve fit and the gutter came back off. The SLEEP SCREEN
         section has since taken it to nine, so a header plus one row is eleven
         again -- inside twelve, no rail, no gutter, rows still running to the
         panel edge. And no code changes either way: renderSettings reads
         `totalRows > rows` rather than assuming.

         V1.1 IS THE CONNECT FLOW, NOT TRANSFER. This row opens WifiSettings,
         where a network can be joined, preferred and forgotten. There is still no
         way to send a book to the device, which is why HomeEmpty.dc.html's action
         slab STAYS ABSENT -- its call to action was SEND BOOKS OVER WI-FI, and a
         primary action that cannot work is worse than none. Wi-Fi existing is not
         the condition that brings it back; transfer is.

         A CHEVRON AND NO VALUE, which is `Typography`'s own rule two sections up:
         a row states a quantity or discloses a screen, never both. The tempting
         `Wi-Fi . ON DEMAND` is exactly the shape that forbids, and Settings' test
         asserts every drawn row does one or the other.

         THE SECOND ROW IS THE DOOR TO WallabagAccount.dc.html, WHICH WAS
         REACHABLE FROM NOTHING. c2468df cut an `Instapaper / SIGNED IN` row from
         this section alongside Home's; this restores its successor. Home's
         ARTICLES row is the door to the LIST -- what to read -- and this is the
         door to SETUP AND STATUS, which is what Settings is for. Two doors to
         two different rooms, not two doors to one.

         IT IS A CHEVRON AND NO VALUE, LIKE THE ROW ABOVE IT, and the tempting
         `wallabag . NOT SET UP` is refused by the paragraph above for the same
         reason `Wi-Fi . ON DEMAND` is. A row states a quantity or discloses a
         screen, never both, and Settings' own test asserts it of every drawn
         row. The setup state is not lost by this: WallabagAccount.dc.html's
         band carries `SIGNED IN` or `NOT SET UP` as the first thing on the
         screen the chevron opens, which is where a state that needs a sentence
         of context belongs.

         AND A VALUE HERE WOULD BE A NAG BY THE OTHER ROUTE. Main.dc.html's menu
         note refuses `NOT SET UP` on Home's ARTICLES row -- a device nobody has
         set up should not open on a list of chores -- and Settings being a
         deliberate visit answers the NAG half of that while leaving the
         quantity-or-chevron half exactly where it was.

         TWELVE ITEMS, WHICH IS THE COUNT THE PARAGRAPH ABOVE SAYS TO CHECK
         RATHER THAN ASSUME. Eleven fit with room; this is the twelfth and it is
         the last that does. Rendered at both geometries with no rail and no
         14px gutter, rows still running to the panel edge. The next row added
         to this screen starts it scrolling, and needs no code change to do so
         -- renderSettings reads `totalRows > rows`.

         No `border-bottom` on this one: it is now the last drawn row, and the
         Wi-Fi row above took its own rule back when it stopped being. -->
    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px; border-top: 2px solid #000000;">CONNECTIONS</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px; border-bottom: 1px solid #000000;">
      <div style="font-size: var(--t-value); font-weight: 500;">Wi-Fi</div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 24px;">
      <div style="font-size: var(--t-value); font-weight: 500;">Wallabag</div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
    </div>

  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
    <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">OPEN</div></div>
    <div style="display: flex; align-items: center; gap: 6px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
    <div style="display: flex; align-items: center; gap: 6px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
