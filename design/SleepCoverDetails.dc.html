<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; box-sizing: border-box; position: relative;">

  <!-- THIS BOARD IS `Sleep.dc.html` WITH ITS BACKGROUND REPLACED, AND NOTHING
       ELSE. Same card, same badge, same type roles, same box model. COVER +
       DETAILS is the mode that keeps the NOW READING block and puts the book's
       own cover behind it, so anything that differs here from Sleep.dc.html is
       a defect rather than a design decision. The one addition below the image
       is `position: relative` on the card, which is a STACKING fix and not a
       design change: the cover is absolutely positioned, so an in-flow card
       would paint underneath it.

       THE COVER IS GENERATED BY OUR OWN PIPELINE AND COMMITTED, NOT AUTHORED.
       `make compare` renders this board in Chrome and diffs it against the
       firmware per pixel -- and CHROME CANNOT FLOYD-STEINBERG. A hand-drawn or
       CSS-generated cover would mismatch across the whole image and the
       percentage would be measuring the two rasterisers rather than the design.
       So both sides use the one file:

         make sim
         ./build/reader_sim cover <book.epub> design/assets/sleep-cover-480x800.png \
             --canvas 480x800 --fit fill
         ./build/reader_sim cover <book.epub> design/assets/sleep-cover-528x792.png \
             --canvas 528x792 --fit fill

       That is `iconc.py`'s rule -- generated from one source, never transcribed
       twice -- applied to a picture instead of a mark. `design/assets/README.md`
       records which book, and the check that it is public domain.

       THE CARD NAMES A DIFFERENT BOOK FROM THE COVER, AND THAT IS THE BOARD, NOT
       THE DEVICE. The card is Sleep.dc.html's demo copy, kept byte for byte so
       this board differs from it in one thing only; the cover is a real EPUB's
       real cover, and the corpus has no Middlemarch to pair it with. Romola is
       the closest the corpus gets -- same author, so only the title disagrees.
       On the device both come from the same book by construction: one pointer,
       `last.json`, feeds the card and the cover alike.


       TWO FILES, ONE PER PANEL, BECAUSE A FIT IS NOT A SCALE. The X4 is 3:5 and
       the X3 is 2:3, so `--fit fill` crops a 1400x2100 cover differently on each
       and the dither grid is keyed on absolute panel coordinates either way.
       Letting Chrome resample the 480x800 file up to 528x792 would compare the
       browser's resampler against the firmware's dither, which is the exact
       thing this asset exists to avoid. `(width: 528px)` is the X3 render:
       compare-design.py drives Chrome at `--window-size=WxH`, so the viewport IS
       the panel. A human opening this file in an ordinary window sees the
       authored X4 asset, which is what the board is authored at.

       NOTE FOR WHOEVER REGISTERS THIS SCREEN: compare-design.py serves the
       board's extracted markup from a TEMPORARY directory containing only
       index.html, so this relative `src` will 404 there until the tool also
       serves `design/`. It fails loudly -- a blank frame against a cover is a
       huge mismatch, not a quiet one -- but it fails. -->
  <picture>
    <source media="(width: 528px)" srcset="assets/sleep-cover-528x792.png">
    <img src="assets/sleep-cover-480x800.png" alt=""
         style="position: absolute; top: 0px; left: 0px; width: 480px; height: 800px; object-fit: cover; display: block;">
  </picture>

  <!-- THE CARD'S `max-height` IS THE BOUND, and it is the badge's own footprint
       reserved TWICE -- Sleep.dc.html's rule and its number, because this is the
       same card over a picture rather than over the dither field. The card is
       centred in the panel and the badge is anchored 34px off the bottom, so
       `centreIn` splits whatever slack there is EVENLY: reserving the badge once
       still leaves a tall card hanging half a badge into it. 158px is 2 x (34px of
       offset + the badge's own 45px box: --t-meta's 27px line, 8px of padding and a
       1px border, each side). renderSleep derives it from drawBadge's returned top
       rather than pinning it; the number is spelled here because CSS has no way to
       ask the badge how tall it is.

       Over a cover the collision is worse, not better: the badge is opaque white
       and so is the card, so a title that ran under the badge would be hidden by
       it with the picture giving no hint that anything was cut. -->
  <div style="position: relative; background: #ffffff; border: 2px solid #000000; padding: 38px 42px; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 400px; max-height: calc(100% - 158px); overflow: hidden;">
    <div style="font-size: var(--t-meta); letter-spacing: 0.26em; font-weight: 500;">NOW READING</div>
    <div style="width: 44px; border-top: 2px solid #000000;"></div>
    <!-- ON THE RAMP, at `--t-title`. This said `font-size: 53px`, which is in no
         role: the ramp is 21/23/25/29/42/67 at 150 DPI and 53px is 25.4pt, not a
         value anything else asks for. A role costs a pre-rendered asset per size
         AND weight -- 15-20 KB of flash -- and this is the only board that wanted
         it.
         
         The soft hyphen went with it. It was there because MIDDLEMARCH at 53px is
         ~390px against this card's 316px of content, so the title had to break;
         at 42px it measures ~308px and fits on one line. A longer title elides,
         which is the rule for every screen but Book details.
         
         The cost, stated rather than hidden: the hero of this screen is smaller
         than it was drawn. If it reads as too quiet on glass, the fix is a new
         role and a wrap that honours a soft hyphen -- both real work, and neither
         worth it for a screen shown while the device is asleep until the panel
         says so.

         IT WRAPS, AND IT USED TO ELIDE. This comment ended "a longer title
         elides, which is the rule for every screen but Book details", and that
         rule is wrong HERE for Main.dc.html's reason: an ellipsis on a LIST ROW
         hides only which of seven rows this is, and on this screen it hides the
         one fact the screen exists to state. This is the last thing on the glass
         for hours -- longer than any other screen is looked at -- so a name cut
         short is the defect a reader lives with, not one they press past.

         `overflow-wrap: anywhere` because the break has to be allowed inside a
         word: a title falling back to a filename is usually one word, and CSS
         offers no break opportunity at an underscore or a hyphen. Same two words
         as Main.dc.html's title and BookDetails.dc.html's, for the same reason.

         The bound is the CARD's `max-height` above, not a line count here: the
         card's height is a result and it is what collides with the badge. -->
    <div style="font-size: var(--t-title); font-weight: 700; text-align: center; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere;">Middlemarch</div>
    <!-- THE AUTHOR WRAPS TO TWO LINES AND THEN ELIDES, and it used to do NEITHER --
         so a long name escaped the card entirely. A centred run is placed at
         `centreIn(0, contentW, w)`, which returns a NEGATIVE half when the run is
         wider than the box: the name began left of this card's padding, painted
         over both 2px borders and out onto the dither field, and was finally
         clipped by the panel edge. "Fyodor Mikhailovich Dostoevsky" measures 540px
         against 312px of content and rendered as ODOR MIKHAILOVICH DOSTOEVS -- cut
         at BOTH ends, with no ellipsis to say so, sitting on top of the frame.

         MEASURED RATHER THAN ASSUMED: every `dc:creator` in the 225-book corpus, at
         this face and this tracking, against this column. 68 of 221 (30.8%)
         overflow -- so an ellipsis here is the COMMON case and not the edge one --
         and of those 68, 58 (85%) fit WHOLE in exactly two lines. Only 10 need a
         third and every one is a corporate author ("United States. Central
         Intelligence Agency", 735px). None of the 16 books on the author's own
         shelf overflow at all, which is the INVERSE of the progressive-JPEG
         finding, and the reason the figure is quoted with its split rather than as
         one number.

         TWO IS THEREFORE THE CAP, AND IT IS A LINE COUNT WHERE THE TITLE'S BOUND IS
         THE CARD'S `max-height`. The two bounds are different KINDS deliberately:
         both runs can grow now, and one budget cannot serve two growable runs
         without saying who yields first. The AUTHOR yields -- it is capped at two
         lines before the title is measured at all, so the title, the one fact this
         screen exists to state, keeps every line left over. Splitting the budget
         proportionally instead would let a three-line corporate name eat the hero.

         THE WRAP DOES NOT REMOVE THE ELISION, it only makes it rare: the third line
         and beyond still elide, which is what `-webkit-line-clamp` draws here and
         what clampProse draws in the firmware. So this is a change of DEGREE -- how
         much of a name survives -- and not the arrival of truncation.

         `overflow-wrap: anywhere` for the title's reason directly above: a name can
         arrive as one unbroken token and CSS offers no break opportunity inside it.
         `text-align: center` was implicit while this was a single line and has to be
         stated once it can be two. -->
    <div style="font-size: var(--t-label); letter-spacing: 0.22em; text-align: center; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;">GEORGE ELIOT</div>
    <div style="width: 170px; height: 8px; border: 1px solid #000000; box-sizing: border-box; margin-top: 8px;">
      <div style="width: 6%; height: 100%; background: #000000;"></div>
    </div>
    <!-- THE PERCENTAGE AND THE CHAPTER ARE TWO RUNS NOW, AND THEY WERE ONE
         (`6% &middot; CH. 01`) WITH THE CHAPTER AS A SPINE POSITION.

         This was the last place on the device that showed a position where a NAME
         is available. It was never Main.dc.html's false claim -- `CH. 01` with no
         total invites no arithmetic, and it is the Reader's own fallback form --
         so this is an improvement rather than a fix, and it may not be bought at
         the price of a regression.

         WHY IT SPLIT INTO TWO LINES: the name does not fit, and it does not
         nearly fit. Measured over 225 real books -- 205 with a usable NCX, 8,617
         chapter labels, at `--t-label`/500 against this card's 312px content
         column (tools/sleep_chapter_probe.cpp, which is re-runnable on a new
         book): p50 217px, p90 536px, max 1887px. The MEDIAN label overflows, and
         only 33 of the 205 books have every label fitting.

         So the two facts cannot share a row. The percentage is the QUANTITY and
         may not shrink, and a name sharing the row with `100% &middot; ` gets 213
         of the 312px and elides 52.51% of labels -- more of the time than not. On
         its own line it gets all 312 and elides 34.54%, which is the band the
         project has already accepted for this exact string: Main.dc.html's own
         chapter line elides 30.70% of the same labels on the X4 and 23.69% on the
         X3. Splitting also protects the percentage BY CONSTRUCTION rather than by
         which end an ellipsis happens to eat.

         AND IT WRAPS TO TWO LINES, WHICH THE AUTHOR TWO RUNS UP ALREADY DOES --
         so both growable runs on this card now grow the same way, and this one
         arrived at it second. It shipped ELIDING on one line, which the
         distribution below permits, and the owner's call is that on THIS screen a
         cut name is not good enough: the card holds the glass for HOURS, longer
         than any other screen is looked at, so a truncated chapter is one the
         reader lives with rather than one they press past. That is the identical
         argument that made the title wrap and then the author, reaching the last
         run on the card.

         THE DATA CARRIES TWO LINES AND STOPS THERE. Of this column's 8,617
         labels, 2,976 (34.54%) overflow one line; of those 2,976, 2,274 (76.41%)
         fit two lines WHOLE and 702 (23.59%) need three or more. So a two-line
         cap still elides 702 of 8,617 labels (8.15%) against one line's 34.54% --
         a 4.2x reduction in cut names, which is what earns the second line, and
         it is the same shape of knee the author's cap was earned by (85% there).
         A THIRD line was permitted and is not taken: it buys a smaller marginal
         gain out of another of the title's lines.

         SO ELISION IS MOVED RATHER THAN REMOVED. 8.15% of labels still need it,
         so `-webkit-line-clamp: 2` draws it on the SECOND line where it used to
         draw on the first, and clampProse draws it in the firmware. This is a
         change of DEGREE -- how much of a name survives -- and not the departure
         of truncation.

         AND THE TWO LINES ARE RESERVED WHETHER OR NOT THE NAME USES THEM, which
         is the whole of how this stays safe. The objection this run elided for is
         real, and it is NOT answered by the rate: A CHAPTER CHANGES WHILE THE
         BOOK IS BEING READ AND AN AUTHOR DOES NOT. This card's height is a sum
         and the title takes whatever is left, so a chapter free to GROW would
         make the TITLE's budget depend on where the reader is STANDING -- cross a
         chapter boundary and the book's name could reflow, or newly acquire an
         ellipsis, because a page was turned. That is a visible defect with a
         baffling cause. `min-height: 58px` -- two of this run's own stated 29px
         lines -- is what removes it: the run is 58px tall for a one-line name and
         a three-line one alike, so the title's budget is a CONSTANT and the
         card's layout is a function of the BOOK, exactly as it was at one line.

         DO NOT MAKE THE RESERVATION CONDITIONAL. Giving a one-line name a
         one-line box is the obvious tightening, and it reintroduces the whole
         defect above -- while LOOKING like a saving, because the specimen on this
         board is one line and so is the common case. What the always-reserved
         second line actually costs is a slightly different centring of an opaque
         card on a dithered field, since the card is CENTRED: there is nothing a
         reader can point at.

         WHAT IT COSTS, stated rather than discovered: two lines in the card's
         fixed sum, so the title's derived budget goes from 8 lines to 6 on both
         panels -- 642px of card room on the X4 and 634px on the X3, less the
         325px that is not the title when the author takes one line, over the
         title's own 46px line box. 9 of the 225 corpus titles (4.00%) elide at a
         budget of 6, against 6 at 7 and 4 at 8, so the second reserved line costs
         3 titles and this whole run costs 5. The title still keeps six times what
         this run takes.

         THE NAME TAKES 0.10em AND THE PERCENTAGE KEEPS 0.14em, which is
         Main.dc.html's split and its reason: 0.14em is a COUNTER's tracking and a
         name is not a counter. It is also 3.06 percentage points narrower, on the
         one run whose width is the whole problem.

         NOT SHOUTED, although the title and the author on this card both are.
         Three screens already name this string as the publisher wrote it -- the
         Reader's band, Contents' rows and Main.dc.html's meta line -- and one
         rule should have one spelling; `toc.h` hands the label over "as authored"
         for exactly this reason. Shouting also measures 2.19 points WIDER
         (36.73% against 34.54%), which is the wrong direction for this run.

         WEIGHT 500, WHERE THIS RUN SAID 700. The ramp carries Label400 and
         Label500 at 11pt and no Label700 (reader/font_manifest.h), so 700 here
         asked for a pre-rendered asset nobody has -- unbuildable, which is the
         same thing LowBattery.dc.html's band label was corrected for. The
         firmware has always drawn Role::Label500 on this run, so this moves the
         BOARD onto what is drawable and no golden with it.

         AND THE NAME'S LINE BOX IS STATED, WHERE THIS RUN LEFT IT AT `normal`.
         29px is the face's own line height at this ppem, which is what the
         firmware derives -- and Chrome's `normal` resolves it to 30, so a card
         with one more unstated run came out a pixel taller in the browser than on
         the panel. That is the Sleep TITLE's lesson (its `line-height: 1.1`
         exists because the face would have given 53 where the board wanted 46)
         and Peek.dc.html's (stating the panel's own height "closed a
         disagreement rather than documenting it"), and it is worth stating even
         though it is only a pixel: the card is CENTRED, so a pixel of height is
         half a pixel of offset at both ends, and every rule inside it goes out of
         register with the board.

         Measured: with the box unstated this screen went 2.42%/2.22% to
         3.03%/2.78% against the board -- the whole of that regression was this one
         line -- and with it stated it is 2.32%/2.13%, which is better than before
         the chapter arrived. The card's borders go from 2px out of register to
         1px. -->
    <div style="font-size: var(--t-label); letter-spacing: 0.14em; font-weight: 500;">6%</div>
    <div style="font-size: var(--t-label); letter-spacing: 0.1em; font-weight: 500; line-height: 29px; align-self: stretch; text-align: center; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; min-height: 58px;">I &middot; Miss Brooke</div>
  </div>

  <!-- THE BADGE STAYS HERE, AND IT IS THE HALF THAT CANNOT GO. CLAUDE.md's rule
       is that it is load-bearing: e-ink holds its last image with no power, so a
       screen left on the glass gives no clue the device is asleep rather than
       frozen. This mode still draws a card -- a book title over a picture is a
       screen the device could plausibly be showing awake -- so the badge is the
       only thing saying which. `SleepCover.dc.html` is the one place it goes,
       and that board carries the argument for why. -->
  <div style="position: absolute; bottom: 34px; background: #ffffff; border: 1px solid #000000; padding: 8px 18px;">
    <div style="font-size: var(--t-meta); letter-spacing: 0.2em;">ASLEEP &middot; HOLD POWER TO WAKE</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
