<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; box-sizing: border-box; position: relative;">

  <!-- THIS BOARD IS `Sleep.dc.html` WITH ITS BACKGROUND REPLACED, AND NOTHING
       ELSE. Same card, same badge, same type roles, same box model. COVER +
       DETAILS is the mode that keeps the NOW READING block and puts the book's
       own cover behind it, so anything that differs here from Sleep.dc.html is
       a defect rather than a design decision. The one addition below the image
       is `position: relative` on the card, which is a STACKING fix and not a
       design change: the cover is absolutely positioned, so an in-flow card
       would paint underneath it.

       THE COVER IS GENERATED BY OUR OWN PIPELINE AND COMMITTED, NOT AUTHORED.
       `make compare` renders this board in Chrome and diffs it against the
       firmware per pixel -- and CHROME CANNOT FLOYD-STEINBERG. A hand-drawn or
       CSS-generated cover would mismatch across the whole image and the
       percentage would be measuring the two rasterisers rather than the design.
       So both sides use the one file:

         make sim
         ./build/reader_sim cover <book.epub> design/assets/sleep-cover-480x800.png \
             --canvas 480x800 --fit fill
         ./build/reader_sim cover <book.epub> design/assets/sleep-cover-528x792.png \
             --canvas 528x792 --fit fill

       That is `iconc.py`'s rule -- generated from one source, never transcribed
       twice -- applied to a picture instead of a mark. `design/assets/README.md`
       records which book, and the check that it is public domain.

       THE CARD NAMES A DIFFERENT BOOK FROM THE COVER, AND THAT IS THE BOARD, NOT
       THE DEVICE. The card is Sleep.dc.html's demo copy, kept byte for byte so
       this board differs from it in one thing only; the cover is a real EPUB's
       real cover, and the corpus has no Middlemarch to pair it with. Romola is
       the closest the corpus gets -- same author, so only the title disagrees.
       On the device both come from the same book by construction: one pointer,
       `last.json`, feeds the card and the cover alike.


       TWO FILES, ONE PER PANEL, BECAUSE A FIT IS NOT A SCALE. The X4 is 3:5 and
       the X3 is 2:3, so `--fit fill` crops a 1400x2100 cover differently on each
       and the dither grid is keyed on absolute panel coordinates either way.
       Letting Chrome resample the 480x800 file up to 528x792 would compare the
       browser's resampler against the firmware's dither, which is the exact
       thing this asset exists to avoid. `(width: 528px)` is the X3 render:
       compare-design.py drives Chrome at `--window-size=WxH`, so the viewport IS
       the panel. A human opening this file in an ordinary window sees the
       authored X4 asset, which is what the board is authored at.

       NOTE FOR WHOEVER REGISTERS THIS SCREEN: compare-design.py serves the
       board's extracted markup from a TEMPORARY directory containing only
       index.html, so this relative `src` will 404 there until the tool also
       serves `design/`. It fails loudly -- a blank frame against a cover is a
       huge mismatch, not a quiet one -- but it fails. -->
  <picture>
    <source media="(width: 528px)" srcset="assets/sleep-cover-528x792.png">
    <img src="assets/sleep-cover-480x800.png" alt=""
         style="position: absolute; top: 0px; left: 0px; width: 480px; height: 800px; object-fit: cover; display: block;">
  </picture>

  <!-- THE CARD'S `max-height` IS THE BOUND, and it is the badge's own footprint
       reserved TWICE -- Sleep.dc.html's rule and its number, because this is the
       same card over a picture rather than over the dither field. The card is
       centred in the panel and the badge is anchored 34px off the bottom, so
       `centreIn` splits whatever slack there is EVENLY: reserving the badge once
       still leaves a tall card hanging half a badge into it. 158px is 2 x (34px of
       offset + the badge's own 45px box: --t-meta's 27px line, 8px of padding and a
       1px border, each side). renderSleep derives it from drawBadge's returned top
       rather than pinning it; the number is spelled here because CSS has no way to
       ask the badge how tall it is.

       Over a cover the collision is worse, not better: the badge is opaque white
       and so is the card, so a title that ran under the badge would be hidden by
       it with the picture giving no hint that anything was cut. -->
  <div style="position: relative; background: #ffffff; border: 2px solid #000000; padding: 38px 42px; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 400px; max-height: calc(100% - 158px); overflow: hidden;">
    <div style="font-size: var(--t-meta); letter-spacing: 0.26em; font-weight: 500;">NOW READING</div>
    <div style="width: 44px; border-top: 2px solid #000000;"></div>
    <!-- ON THE RAMP, at `--t-title`. This said `font-size: 53px`, which is in no
         role: the ramp is 21/23/25/29/42/67 at 150 DPI and 53px is 25.4pt, not a
         value anything else asks for. A role costs a pre-rendered asset per size
         AND weight -- 15-20 KB of flash -- and this is the only board that wanted
         it.
         
         The soft hyphen went with it. It was there because MIDDLEMARCH at 53px is
         ~390px against this card's 316px of content, so the title had to break;
         at 42px it measures ~308px and fits on one line. A longer title elides,
         which is the rule for every screen but Book details.
         
         The cost, stated rather than hidden: the hero of this screen is smaller
         than it was drawn. If it reads as too quiet on glass, the fix is a new
         role and a wrap that honours a soft hyphen -- both real work, and neither
         worth it for a screen shown while the device is asleep until the panel
         says so.

         IT WRAPS, AND IT USED TO ELIDE. This comment ended "a longer title
         elides, which is the rule for every screen but Book details", and that
         rule is wrong HERE for Main.dc.html's reason: an ellipsis on a LIST ROW
         hides only which of seven rows this is, and on this screen it hides the
         one fact the screen exists to state. This is the last thing on the glass
         for hours -- longer than any other screen is looked at -- so a name cut
         short is the defect a reader lives with, not one they press past.

         `overflow-wrap: anywhere` because the break has to be allowed inside a
         word: a title falling back to a filename is usually one word, and CSS
         offers no break opportunity at an underscore or a hyphen. Same two words
         as Main.dc.html's title and BookDetails.dc.html's, for the same reason.

         The bound is the CARD's `max-height` above, not a line count here: the
         card's height is a result and it is what collides with the badge. -->
    <div style="font-size: var(--t-title); font-weight: 700; text-align: center; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere;">Middlemarch</div>
    <div style="font-size: var(--t-label); letter-spacing: 0.22em;">GEORGE ELIOT</div>
    <div style="width: 170px; height: 8px; border: 1px solid #000000; box-sizing: border-box; margin-top: 8px;">
      <div style="width: 6%; height: 100%; background: #000000;"></div>
    </div>
    <div style="font-size: var(--t-label); letter-spacing: 0.14em; font-weight: 700;">6% &middot; CH. 01</div>
  </div>

  <!-- THE BADGE STAYS HERE, AND IT IS THE HALF THAT CANNOT GO. CLAUDE.md's rule
       is that it is load-bearing: e-ink holds its last image with no power, so a
       screen left on the glass gives no clue the device is asleep rather than
       frozen. This mode still draws a card -- a book title over a picture is a
       screen the device could plausibly be showing awake -- so the badge is the
       only thing saying which. `SleepCover.dc.html` is the one place it goes,
       and that board carries the argument for why. -->
  <div style="position: absolute; bottom: 34px; background: #ffffff; border: 1px solid #000000; padding: 8px 18px;">
    <div style="font-size: var(--t-meta); letter-spacing: 0.2em;">ASLEEP &middot; HOLD POWER TO WAKE</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
