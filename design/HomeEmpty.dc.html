<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: flex-end; align-items: center; gap: 7px; padding: 18px 24px 0 24px;">
    <div style="font-size: var(--t-value); font-weight: 700;">87%</div>
    <svg width="38" height="21" viewBox="0 0 22 12" fill="none"><rect x="0.5" y="0.5" width="18" height="11" stroke="#000000"></rect><rect x="2" y="2" width="14" height="8" fill="#000000"></rect><rect x="19.5" y="3.5" width="2" height="5" fill="#000000"></rect></svg>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 44px 24px 0 24px; flex-shrink: 1; min-height: 0; overflow: hidden; text-align: center;">
    <svg width="112" height="112" viewBox="0 0 16 16" fill="none"><path d="M8 3.2C6.6 2 4.3 1.7 2 2v11c2.3-.3 4.6 0 6 1.2 1.4-1.2 3.7-1.5 6-1.2V2c-2.3-.3-4.6 0-6 1.2z" stroke="#000000" stroke-width="0.9"></path><path d="M8 3.2v11" stroke="#000000" stroke-width="0.9"></path></svg>
    <!-- ON THE RAMP, at `--t-title`. This said 39px, which is in no role -- the
         same call the Sleep screen's title needed, and 42px is the nearest thing
         that exists. The 0.06em goes with it: Title700 is drawn untracked
         everywhere else it appears. -->
    <div style="font-size: var(--t-title); font-weight: 700;">NO BOOKS YET</div>
    <!-- CARD ONLY. This read "Copy EPUB files onto the SD card, or send them from
         your computer's browser over Wi-Fi", above a 72px black slab reading SEND
         BOOKS OVER WI-FI -- and Wi-Fi is out of V1 as too big, so the slab was a
         primary action that could not work.
         
         There is NO action slab now, and that is the right shape rather than a
         compromise: the only way to get a book onto this device is to put the card
         in a computer, which is not something a button on the device can do. A
         screen whose whole job is to explain a state should explain it, not offer
         a control that leads nowhere. The Wi-Fi slab returns with Wi-Fi.

         `/books` rather than a bolded "books", which is what this said. Prose in
         this firmware is ONE face -- drawProse takes a single Font -- so a bold
         word inside a sentence is a capability nothing has and one screen is a
         thin reason to build it. A path is also the less ambiguous way to name a
         folder. -->
    <div style="font-size: var(--t-body); line-height: 1.55; max-width: 400px;">Put the SD card in your computer and copy EPUB files into its /books folder.</div>
  </div>
  <!-- THE MENU IS MAIN'S MENU, and this board's copy had drifted from it: it used
       `--t-value` sentence-case labels with a `border-bottom`, where Main.dc.html
       uses `--t-label` caps at 0.18em with a `border-top`. That is Home's menu in
       an older revision, kept alive by a board nothing rendered -- implementing it
       faithfully would have reintroduced a style Home stopped using.
       
       Only the VALUE differs, and it is the whole point of this board: `EMPTY`
       where Home shows a count.

       AND `ARTICLES` IS WHY THAT SENTENCE NOW READS "the value" RATHER THAN
       "one value". This board is the specimen for a device nobody has connected
       a wallabag to, so its ARTICLES row takes the CHEVRON where Main.dc.html
       and HomeUnopened.dc.html state `3 UNREAD` -- a row states a quantity or
       discloses a screen, never both, and an unconfigured one has no quantity.
       It is deliberately not `NOT SET UP`: most readers never connect one, and
       a notice about a feature they did not ask for would sit on the screen
       they see most. Main.dc.html's menu note carries the reasoning and the
       measured cost. -->
  <div style="display: flex; flex-direction: column; margin-top: auto;">
    <!-- FOCUSED. This board inked neither row, which cannot be right on a screen
         whose hint bar says SELECT -- there has to be something selected for it to
         select. Home puts its focus on the CONTINUE block and there is no CONTINUE
         block here, so it falls to the first row that does anything.

         IT KEEPS ITS `border-top`, which is invisible against the fill and is the
         point: an unfocused row is 80px plus a 1px rule and dropping the rule made
         the focused one 80px, so the menu's total height depended on whether a row
         was focused -- and the whole block would step a pixel the moment focus
         entered it. Black on black costs nothing and holds the pitch at 81. -->
    <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; border-top: 1px solid #000000; background: #000000; color: #ffffff;">
      <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">LIBRARY</div>
      <div style="font-size: var(--t-value); font-weight: 700;">EMPTY</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; border-top: 1px solid #000000;">
      <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">ARTICLES</div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; border-top: 1px solid #000000;">
      <div style="font-size: var(--t-label); letter-spacing: 0.18em; font-weight: 500;">SETTINGS</div>
      <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="width: 36px;"></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">SELECT</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
