<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware.

       NOTHING ON THIS BOARD USES THE RAMP, AND THE RAMP STAYS. This screen
       draws no type at all -- the cover is the whole frame -- so every variable
       below is unreferenced here. It is kept because these three sleep boards
       are one screen with its content removed a piece at a time (Sleep ->
       SleepCoverDetails -> SleepCover), and a helmet that drifts between them
       is how two of them stop being comparable. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 480px; height: 800px; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; box-sizing: border-box; position: relative;">

  <!-- COVER, the third sleep mode: the book's own cover full-bleed and nothing
       else. This is `SleepCoverDetails.dc.html` with the card and the badge
       taken away, so the frame, the box model and the helmet are identical to
       it and to `Sleep.dc.html`.

       THE COVER IS GENERATED BY OUR OWN PIPELINE AND COMMITTED, NOT AUTHORED.
       `make compare` renders this board in Chrome and diffs it against the
       firmware per pixel -- and CHROME CANNOT FLOYD-STEINBERG. A hand-drawn or
       CSS-generated cover would mismatch across the whole image and the
       percentage would be measuring the two rasterisers rather than the design.
       On THIS board that is the whole screen, so without the shared file there
       would be nothing here worth comparing at all. Both sides use the one
       file:

         make sim
         ./build/reader_sim cover <book.epub> design/assets/sleep-cover-480x800.png \
             --canvas 480x800 --fit fill
         ./build/reader_sim cover <book.epub> design/assets/sleep-cover-528x792.png \
             --canvas 528x792 --fit fill

       That is `iconc.py`'s rule -- generated from one source, never transcribed
       twice -- applied to a picture instead of a mark. `design/assets/README.md`
       records which book, and the check that it is public domain.

       TWO FILES, ONE PER PANEL, BECAUSE A FIT IS NOT A SCALE. The X4 is 3:5 and
       the X3 is 2:3, so `--fit fill` crops a 1400x2100 cover differently on each
       and the dither grid is keyed on absolute panel coordinates either way.
       Letting Chrome resample the 480x800 file up to 528x792 would compare the
       browser's resampler against the firmware's dither, which is the exact
       thing this asset exists to avoid. `(width: 528px)` is the X3 render:
       compare-design.py drives Chrome at `--window-size=WxH`, so the viewport IS
       the panel. A human opening this file in an ordinary window sees the
       authored X4 asset, which is what the board is authored at.

       NOTE FOR WHOEVER REGISTERS THIS SCREEN: compare-design.py serves the
       board's extracted markup from a TEMPORARY directory containing only
       index.html, so this relative `src` will 404 there until the tool also
       serves `design/`. It fails loudly -- a blank frame against a cover is a
       huge mismatch, not a quiet one -- but it fails. -->
  <picture>
    <source media="(width: 528px)" srcset="assets/sleep-cover-528x792.png">
    <img src="assets/sleep-cover-480x800.png" alt=""
         style="position: absolute; top: 0px; left: 0px; width: 480px; height: 800px; object-fit: cover; display: block;">
  </picture>

  <!-- NO BADGE, AND THIS OVERRIDES A RULE THIS PROJECT WROTE DOWN.
       CLAUDE.md says the badge "is the load-bearing half and it stays", because
       e-ink holds its last image and a screen left on the glass gives no clue the
       device is asleep rather than frozen. The reason it may go HERE does not
       generalise: a full-bleed book cover is not a screen the device can otherwise
       be in, so it is unambiguous by itself, where a Library or a half-read page is
       not.
       It holds only while a cover is actually on the glass. The badge is hidden IFF
       a cover was painted AND the mode is COVER -- one predicate, asked once. Every
       fallback puts it back. -->

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
