  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    .dim-veil { background-image: radial-gradient(circle, #ffffff 1.3px, transparent 1.5px); background-size: 3px 3px; }
  </style>

<!-- THE SECOND OF THREE FAILURE SHAPES. WifiError.dc.html is the first (the
     password was rejected) and WifiErrorFailed.dc.html is the third.

     ONE SENTENCE WOULD BE A LIE, which is BookError's exact argument and the
     reason it is three boards -- damaged, unreadable, out-of-memory -- rather
     than one. A join fails three distinguishable ways, and the shipped copy
     claimed only the first: telling someone their password was rejected by a
     router that is not there is the false-claim shape this project refuses for
     the battery gauge (-1, never 0%) and for a badge promising a wake charging
     cannot deliver.

     THIS IS `NO_AP_FOUND`: the access point did not answer. Out of range, turned
     off, or a scan result that has gone stale while the password was being typed
     -- which is a real window, because the radio is DOWN during typing and typing
     takes minutes at ~520 ms a keystroke.

     `EDIT PASSWORD` IS ABSENT, NOT INERT, and that is the whole reason this board
     exists rather than a flag on the first one. The password is not what went
     wrong, so a slab offering to fix it is an instruction pointing the wrong way.
     BookErrorMemory.dc.html is the precedent and its lesson is explicit: a slab
     that DRAWS AND DOES NOTHING is the works-only-sometimes trap this project has
     shipped twice, where a slab that is not there teaches nothing because there
     is nothing to press. DO NOT MAKE IT INERT.

     The caption stays `COULDN'T JOIN` on all three, as BookError's three shapes
     share `CAN'T OPEN FILE`: the caption names the event and the sentence names
     the cause. And all three keep "Wi-Fi is off again." -- true on every path,
     which is what makes it worth saying once in one place.

     `TRY AGAIN` IS FILLED AND FOCUSED HERE, where the first shape fills
     `EDIT PASSWORD`. components.h's prompt-button spec cites WifiError for the
     filled-plus-outlined pair, and the rule is that the first of the set is the
     focused, filled one -- so with the password slab gone, the retry inherits it.
     That is also the right default: an AP that did not answer often answers on
     the second try. -->
