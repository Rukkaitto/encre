<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">INSTAPAPER</div>
  <div style="font-size: var(--t-value); font-weight: 700;">SIGNED IN</div>
</div>
  <div style="display: flex; flex-direction: column; flex-grow: 1;">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 24px; background: #000000; color: #ffffff;">
  <div style="font-size: var(--t-value); font-weight: 700;">Account</div>
  <div style="font-size: var(--t-value); font-weight: 700;">LUCASG</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">Unread</div>
  <div style="font-size: var(--t-value); font-weight: 700;">3 ARTICLES</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">Last sync</div>
  <div style="font-size: var(--t-value); font-weight: 700;">2 H AGO</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 24px; border-bottom: 1px solid #000000;">
  <div style="font-size: var(--t-value); font-weight: 500;">Keep offline</div>
  <div style="font-size: var(--t-value); font-weight: 700;">NEWEST 50</div>
</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">Pending actions</div>
  <div style="font-size: var(--t-value); font-weight: 700;">1 TO PUSH</div>
</div>
    <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px; border-top: 2px solid #000000;">ACCOUNT</div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">Sign out&hellip;</div>
  
</div>
    <div style="padding: 14px 24px 0 24px;">
      <div style="font-size: var(--t-meta); letter-spacing: 0.1em; line-height: 1.5;">SIGNING OUT REMOVES THE TOKEN AND DOWNLOADED ARTICLES. YOUR INSTAPAPER ACCOUNT IS NOT TOUCHED.</div>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">CHANGE</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
