<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }
    
  </style>
</helmet>
<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 14px 24px; border-bottom: 2px solid #000000;">
  <div style="font-size: var(--t-label); letter-spacing: 0.22em; font-weight: 500;">WI-FI</div>
  <div style="font-size: var(--t-value); font-weight: 700;">ON DEMAND</div>
</div>
  <div style="padding: 16px 24px; border-bottom: 1px solid #000000;">
    <div style="font-size: var(--t-label); line-height: 1.55;">Wi-Fi stays off. It connects only while receiving books &mdash; then turns off again.</div>
  </div>
  <!--
    AUTO IS A PREFERENCE, NOT A SWITCH, and at most one network holds it: it
    means "tried first when the radio comes up". SAVED means known and not
    preferred. SELECT toggles between them in place, which is Settings' own
    CHANGE idiom and needs no screen.

    THE HOLD RING ON THE `SELECT` SLOT IS ALREADY DRAWN BELOW and it binds
    FORGET -- spec 4.0: "Long-press Confirm on any list item = contextual
    actions overlay ... Saved Wi-Fi networks: hold to forget." It opens
    WifiNetworkActions.dc.html, a one-row overlay, which is the step between
    the press and the loss. No second confirmation: forgetting a network costs
    you retyping a password, where deleting a book is irreversible and gets
    DeleteConfirm.

    This is the SECOND hold in the firmware; the Library's is the first, and
    the binding is identical (Confirm short opens, Confirm long acts on the
    row).

    Forgetting the AUTO network leaves ZERO AUTO. Nothing is silently promoted
    -- a preference is the user's, and changing it behind their back with
    nothing on the glass to say so is the false-claim shape this project
    refuses for the battery gauge. Zero AUTO is legal and is not a dead end:
    bring-up then tries every saved network in the order the last scan ranked
    them.
  -->
  <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">SAVED NETWORKS</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px; background: #000000; color: #ffffff;">
  <div style="font-size: var(--t-value); font-weight: 700;">HOME</div>
  <div style="font-size: var(--t-value); font-weight: 700;">AUTO</div>
</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">BUREAU</div>
  <div style="font-size: var(--t-value); font-weight: 700;">SAVED</div>
</div>
  <!--
    THE `Start setup hotspot . SHOWS QR` ROW IS GONE, and it returns with the
    hotspot screen. Two reasons, and the first is the rule:

    A row states a quantity OR discloses a screen, never both. `SHOWS QR` is a
    value describing where the press leads, sitting where `Join another
    network...` puts a chevron -- so the one section had two spellings of
    disclosure, and one of them was the shape the rule forbids.

    And its screen is a later release. V1.1 is the CONNECT flow only:
    SetupHotspot.dc.html needs an AP, an HTTP server and WebSetup.dc.html, all
    of which are V2. The precedent for cutting rather than drawing-and-skipping
    is the reader menu's `Names` row -- a row waiting on its own screen INSIDE
    the release is drawn and skipped, a row waiting on a LATER RELEASE comes off
    the board, because focus-skipping stops it misleading a reader who PRESSES
    it and does nothing about it promising a feature the release does not have.

    `Join another network...` IS THEREFORE THE LAST DRAWN ROW AND LOSES ITS
    RULE. That is renderLibrary's `i != rows - 1` verbatim: the list's bottom
    edge is left open rather than hanging a hairline over the slack above the
    hint bar. It had a border-bottom only because a row followed it.
  -->
  <div style="font-size: var(--t-meta); letter-spacing: 0.2em; font-weight: 500; padding: 18px 24px 6px 24px;">SETUP</div>
  <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 24px;">
  <div style="font-size: var(--t-value); font-weight: 500;">Join another network&hellip;</div>
  <svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#000000" stroke-width="2"></path></svg>
</div>
  <div style="margin-top: auto;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">SELECT</div><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="none" stroke="#000000" stroke-width="1"></circle></svg></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":480,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
