<!doctype html>
<html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
  <style>
    /* Chrome type ramp, in points at 150 DPI as CrossPoint does it:
       ppem = pt * 150 / 72. The px values below are what a 220 PPI panel
       actually renders; the pt value is the portable intent. Sizes below
       ~10pt are not legible on this glass -- measured on X3 hardware. */
    :root {
      --t-meta:    21px;  /* 10pt - hint labels, row metadata */
      --t-label:   23px;  /* 11pt - band labels, menu row labels */
      --t-value:   25px;  /* 12pt - right-aligned values, cover strip */
      --t-body:    29px;  /* 14pt - list item titles */
      --t-title:   42px;  /* 20pt - screen and book titles */
      --t-display: 67px;  /* 32pt - the dominant numeral */
    }
    body { margin: 0; background: #ffffff; }
    a { color: #000000; } a:hover { color: #000000; }

  </style>
</helmet>

<!-- THE OVERFLOW STATE of WifiPicker.dc.html, and the second scrolling list in
     the firmware after the Library. CLAUDE.md's rail section says the rail
     "governs every scrollable list, and today that is Library alone" -- and its
     own history named WifiPicker there, until Wi-Fi was cut and the mention went
     with it. This is that list arriving.

     WHY IT NEEDS A BOARD AND NOT A GOLDEN: the gutter takes 14px off every row,
     so this is a different geometry, not a different string. LibraryScrolled.dc.html
     is the precedent, for exactly that reason.

     THE FICTION IS 18 NETWORKS PLUS THE RESCAN ROW -- 19 items, 7 visible,
     scrolled so item 6 is first. Height is visible/total and top is first/total,
     BOTH proportions, in percent so they survive the reflow to the X3's 528x792:
     7/19 = 36.8% and 5/19 = 26.3%. LibraryScrolled records why the numbers
     matter -- its first draft showed 7 of 9, which put the thumb at 78% of the
     track, correct and useless as a specification because a FIXED-SIZE thumb
     would look identical. A proportion has to be one only the rule could produce.

     18 IS NOT AN EXOTIC NUMBER. The board it varies shows five, which is a quiet
     street; a block of flats returns thirty, and the list is capped at 20 with
     Rescan last so the action stays reachable in a couple of held presses. Up and
     Down declare auto-repeat here, as Library and Contents do.

     DEDUPLICATED BY SSID, KEEPING THE STRONGEST, which is why no name appears
     twice on this board even though a dual-band router answers a scan twice. The
     two bands take the same credential, so two identical rows would be a choice
     with no meaning. Sorted by signal descending -- the network you are standing
     next to is the one at the top. -->

<div style="width: 480px; height: 800px; background: #ffffff; color: #000000; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <div style="font-size: var(--t-value); font-weight: 700;">18 FOUND</div>
</div>

      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 0 0 24px; border-bottom: 1px solid #000000;">
        <div style="font-size: var(--t-value); font-weight: 500;">CAFE-BIBLIO</div>
        <div style="display: flex; align-items: center; gap: 12px;"><svg width="19" height="24" viewBox="0 0 10 13" fill="none"><rect x="0.7" y="5.7" width="8.6" height="6.6" stroke="#000000" stroke-width="1.4"></rect><path d="M2.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#000000" stroke-width="1.4"></path></svg><svg width="30" height="23" viewBox="0 0 17 13"><rect x="0" y="8" width="4" height="5" fill="#000000"></rect><rect x="6" y="4" width="4" height="9" fill="none" stroke="#000000" stroke-width="1"></rect><rect x="12" y="0" width="4" height="13" fill="none" stroke="#000000" stroke-width="1"></rect></svg></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 0 0 24px; background: #000000; color: #ffffff;">
        <div style="font-size: var(--t-value); font-weight: 700;">FREEBOX-A23B</div>
        <div style="display: flex; align-items: center; gap: 12px;"><svg width="19" height="24" viewBox="0 0 10 13" fill="none"><rect x="0.7" y="5.7" width="8.6" height="6.6" stroke="#ffffff" stroke-width="1.4"></rect><path d="M2.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#ffffff" stroke-width="1.4"></path></svg><svg width="30" height="23" viewBox="0 0 17 13"><rect x="0" y="8" width="4" height="5" fill="#ffffff"></rect><rect x="6" y="4" width="4" height="9" fill="none" stroke="#ffffff" stroke-width="1"></rect><rect x="12" y="0" width="4" height="13" fill="none" stroke="#ffffff" stroke-width="1"></rect></svg></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 0 0 24px; border-bottom: 1px solid #000000;">
        <div style="font-size: var(--t-value); font-weight: 500;">SFR-8C40</div>
        <div style="display: flex; align-items: center; gap: 12px;"><svg width="19" height="24" viewBox="0 0 10 13" fill="none"><rect x="0.7" y="5.7" width="8.6" height="6.6" stroke="#000000" stroke-width="1.4"></rect><path d="M2.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#000000" stroke-width="1.4"></path></svg><svg width="30" height="23" viewBox="0 0 17 13"><rect x="0" y="8" width="4" height="5" fill="#000000"></rect><rect x="6" y="4" width="4" height="9" fill="none" stroke="#000000" stroke-width="1"></rect><rect x="12" y="0" width="4" height="13" fill="none" stroke="#000000" stroke-width="1"></rect></svg></div>

      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 0 0 24px; border-bottom: 1px solid #000000;">
        <div style="font-size: var(--t-value); font-weight: 500;">VOISIN-5G</div>
        <div style="display: flex; align-items: center; gap: 12px;"><svg width="19" height="24" viewBox="0 0 10 13" fill="none"><rect x="0.7" y="5.7" width="8.6" height="6.6" stroke="#000000" stroke-width="1.4"></rect><path d="M2.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#000000" stroke-width="1.4"></path></svg><svg width="30" height="23" viewBox="0 0 17 13"><rect x="0" y="8" width="4" height="5" fill="#000000"></rect><rect x="6" y="4" width="4" height="9" fill="none" stroke="#000000" stroke-width="1"></rect><rect x="12" y="0" width="4" height="13" fill="none" stroke="#000000" stroke-width="1"></rect></svg></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 0 0 24px; border-bottom: 1px solid #000000;">
        <div style="font-size: var(--t-value); font-weight: 500;">BBOX-2E1A</div>
        <div style="display: flex; align-items: center; gap: 12px;"><svg width="19" height="24" viewBox="0 0 10 13" fill="none"><rect x="0.7" y="5.7" width="8.6" height="6.6" stroke="#000000" stroke-width="1.4"></rect><path d="M2.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke="#000000" stroke-width="1.4"></path></svg><svg width="30" height="23" viewBox="0 0 17 13"><rect x="0" y="8" width="4" height="5" fill="none" stroke="#000000" stroke-width="1"></rect><rect x="6" y="4" width="4" height="9" fill="none" stroke="#000000" stroke-width="1"></rect><rect x="12" y="0" width="4" height="13" fill="none" stroke="#000000" stroke-width="1"></rect></svg></div>
      </div>
    </div>

    <!-- THE SCROLL RAIL, in a gutter of its own -- 14px, the same column
         LibraryScrolled.dc.html reserves, and reserved on this board ONLY. The
         populated WifiPicker.dc.html has no gutter and its rows run to the panel
         edge, focused fill included: reserving it on both leaves a white strip
         beside the full-bleed focused row on every list that fits, which reads as
         a rendering fault. One condition drives both, and drawScrollRail refuses
         the same case independently so they cannot disagree.

         Axis-aligned and coverage 0-or-3, which IS the best case on this glass:
         track and thumb are identical in every plane and every pass. The
         thin-stroke warning this project records is about DIAGONALS and does not
         reach a vertical bar. -->
    <div style="position: absolute; top: 6px; bottom: 6px; right: 4px; width: 6px; border: 1px solid #000000; box-sizing: border-box;">
      <div style="position: absolute; left: 0; right: 0; top: 26.3%; height: 36.8%; background: #000000;"></div>
    </div>

  </div>

  <!-- The footer note is CHROME, not slack. On WifiPicker.dc.html it sits above
       the hint bar on a `margin-top: auto`, which a scrolling list has none of --
       so drawing it only when the list fits would delete it exactly when there
       are most networks to disambiguate. It keeps its place and the list scrolls
       in what is left. -->
  <div style="padding: 0 24px 14px 24px;">
    <div style="font-size: var(--t-meta); letter-spacing: 0.1em; line-height: 1.5;">OPEN NETWORKS JOIN DIRECTLY; LOCKED ONES ASK FOR A PASSWORD.</div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 16px 24px; border-top: 1px solid #000000;">
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M6 4L2 8l4 4" stroke="#000000" stroke-width="1.6"></path><path d="M2 8h8a4 4 0 0 0 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">BACK</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.2" fill="#000000"></circle></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">JOIN</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">UP</div></div>
  <div style="display: flex; align-items: center; gap: 7px;"><svg width="25" height="25" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="#000000" stroke-width="1.6"></path></svg><div style="font-size: var(--t-meta); letter-spacing: 0.12em; white-space: nowrap;">DOWN</div></div>

</x-dc>
