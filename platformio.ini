[platformio]
default_envs = xteink
src_dir = shell/src

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++2a
# Vendored single-header libraries, and the firmware needs exactly one of them:
# third_party/stb_truetype.h, which core/src/scalablefont.cpp compiles into the
# body-text rasteriser. It is here rather than in core/library.json so that this
# file and CMakeLists.txt state the same include path in the same words -- the
# desktop build has had `-Ithird_party` since Phase 1 for png.cpp, and a second
# spelling of it in JSON (which cannot carry this comment) is how the two builds
# start disagreeing about where a header lives. `-I` in an env's build_flags
# reaches the symlinked libraries too, which is what makes one line enough.
  -Ithird_party
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
build_unflags =
  -std=gnu++11
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
# See partitions.csv for why, and for what makes the switch safe. Without it the
# board default caps the app at 1.31 MB, which Phase 2C had already half spent.
board_build.partitions = partitions.csv
lib_deps =
  ReaderCore=symlink://core
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect

[env:xteink]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1

# THE ANTI-ALIAS A/B, and it is a comparison rather than a candidate.
#
# `xteink_aa` swaps the body face's coverage quantiser for the reference
# firmware's SHAPE: 4-bit thresholds at (3, 6, 10) instead of our gamma-2.0 curve.
# Measured on real text at ppem 32, that ramp carries 97.7% of our ink -- so it is
# LIGHTER overall, not darker, which is the opposite of what the roadmap recorded.
# What it actually changes is the edge: our 0->1 step is at coverage 8/255 and
# theirs at 43, so their glyph edges are crisp where ours carry a wide faint halo.
#
# Which reads better is a question about THIS GLASS and cannot be answered on a
# monitor, so both builds exist and the panel decides. Flash them in either order
# and read the same page of the same book in the same light:
#
#   pio run -e xteink    -t upload   # the shipping curve
#   pio run -e xteink_aa -t upload   # the reference's shape
#
# Body face only -- chrome is a pre-rendered ramp and is not rebuilt, so any
# body-vs-chrome weight difference is an artifact of the experiment.
[env:xteink_aa]
extends = env:xteink
build_flags =
  ${env:xteink.build_flags}
  -DENCRE_AA_THRESHOLDS_4BIT=1

