[platformio]
default_envs = xteink
src_dir = shell/src

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++2a
# Vendored single-header libraries, and the firmware needs exactly one of them:
# third_party/stb_truetype.h, which core/src/scalablefont.cpp compiles into the
# body-text rasteriser. It is here rather than in core/library.json so that this
# file and CMakeLists.txt state the same include path in the same words -- the
# desktop build has had `-Ithird_party` since Phase 1 for png.cpp, and a second
# spelling of it in JSON (which cannot carry this comment) is how the two builds
# start disagreeing about where a header lives. `-I` in an env's build_flags
# reaches the symlinked libraries too, which is what makes one line enough.
  -Ithird_party
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
build_unflags =
  -std=gnu++11
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
# See partitions.csv for why, and for what makes the switch safe. Without it the
# board default caps the app at 1.31 MB, which Phase 2C had already half spent.
board_build.partitions = partitions.csv
lib_deps =
  ReaderCore=symlink://core
# TJpgDec, the one thing in third_party that is a SOURCE file rather than a
# header, and therefore the one thing `-Ithird_party` above cannot deliver: an
# include path makes it findable and does not make it built. src_dir is
# shell/src, so a .c outside that tree is compiled by nothing -- and
# `build_src_filter = +<../../third_party/tjpgd.c>` is NOT the fix, it is
# accepted, printed back by `pio project config`, and silently ignored. That
# left a firmware that linked only because ReaderCore is an archive and nothing
# in shell/ calls JpegDecoder yet; the first caller would have found it.
# A library entry is what actually compiles it, and third_party/library.json
# narrows that library to this one file so the stb headers beside it are not
# swept in as well. It is not moved into core/src instead because it is C -- it
# assigns alloc_pool's void* straight to typed pointers, legal C and an error in
# C++ -- and because third_party is where this project's vendored code lives.
  TJpgDec=symlink://third_party
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect

[env:xteink]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1

